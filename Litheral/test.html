<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Litheral — integrity over algorithm</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF3300'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea, [contenteditable="true"] {
            user-select: text;
            -webkit-user-select: text;
        }

        :root {
            --primary-orange: #FF3300;
            --primary-orange-dim: #cc2800;
            --bg-dark: #000000;
            --card-bg: #050505;
            --border-color: #1a1a1a;
            --text-main: #e8e8e8;
            --text-secondary: #666666;
            --text-muted: #3a3a3a;
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --sidebar-width: 280px;
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-dark);
            overflow: hidden;
        }

        body {
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            overflow: hidden;
            font-size: 14px;
        }

        /* scanline effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 2px,
                transparent 2px,
                transparent 6px
            );
            pointer-events: none;
            z-index: 9999;
        }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2a2a; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-orange); }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
        .loading-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-spinner { 
            width: 32px; 
            height: 32px; 
            border: 2px solid #1a1a1a; 
            border-top-color: var(--primary-orange); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { 
            color: var(--text-secondary); 
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            font-family: monospace;
        }

        .app-layout { display: flex; height: 100%; width: 100%; overflow: hidden; }
        
        /* SIDEBAR — RAW, NO TRANSITIONS */
        .sidebar { 
            width: var(--sidebar-width); 
            background: #020202; 
            border-right: 1px solid #151515; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            z-index: 30; 
            flex-shrink: 0; 
        }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid #151515; }
        .new-chat-btn { 
            width: 100%; 
            background: transparent; 
            color: var(--primary-orange); 
            border: 1px solid var(--primary-orange); 
            padding: 10px; 
            font-family: monospace;
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            transition: none;
            text-transform: uppercase;
        }
        .new-chat-btn:active { background: rgba(255, 51, 0, 0.1); }
        .sessions-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 12px; 
            margin-bottom: 2px; 
            cursor: pointer; 
            background: transparent; 
            border-left: 2px solid transparent;
        }
        .session-item.active { 
            background: #0a0a0a; 
            border-left-color: var(--primary-orange);
        }
        .session-item:hover { background: #080808; }
        .session-info { flex: 1; min-width: 0; }
        .session-title { 
            font-size: 0.75rem; 
            font-weight: 400; 
            color: var(--text-main); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            font-family: monospace;
        }
        .session-pinned { display: inline-flex; margin-left: 6px; vertical-align: middle; }
        .session-date { 
            font-size: 0.55rem; 
            color: var(--text-secondary); 
            margin-top: 4px; 
            font-family: monospace;
            letter-spacing: 0.5px;
        }
        .session-actions { display: flex; gap: 4px; opacity: 1; }
        .session-action-btn { 
            background: transparent; 
            border: none; 
            padding: 4px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .session-action-btn svg { width: 12px; height: 12px; stroke: #444; stroke-width: 1.8; fill: none; }
        .session-action-btn:hover svg { stroke: var(--primary-orange); }
        .pin-btn.pinned svg { stroke: var(--primary-orange); fill: var(--primary-orange); }

        /* CHAT CONTAINER */
        .chat-container { 
            flex: 1; 
            background: var(--bg-dark); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
        }
        .chat-header { 
            padding: 14px 20px; 
            border-bottom: 1px solid #151515; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            flex-shrink: 0; 
            background: #000000; 
        }
        .menu-toggle { 
            display: none; 
            background: transparent; 
            border: none; 
            color: var(--primary-orange); 
            font-size: 1.2rem; 
            cursor: pointer; 
            margin-right: 12px; 
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 20px; height: 20px; background: var(--primary-orange); }
        .chat-header h1 { 
            font-size: 0.9rem; 
            font-weight: 500; 
            color: var(--primary-orange); 
            letter-spacing: 1.5px; 
            font-family: monospace;
        }
        .balance-container { 
            background: transparent; 
            padding: 4px 10px; 
            border: 1px solid #222;
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }
        .balance-label { color: var(--text-secondary); font-size: 0.6rem; font-family: monospace; text-transform: uppercase; }
        .balance-amount { color: var(--primary-orange); font-weight: 500; font-size: 0.75rem; font-family: monospace; }
        .buy-coins-btn { 
            background: transparent; 
            border: 1px solid var(--primary-orange); 
            color: var(--primary-orange); 
            padding: 3px 8px; 
            font-size: 0.6rem; 
            font-weight: 500; 
            cursor: pointer; 
            font-family: monospace;
            transition: none;
        }
        .buy-coins-btn:active { background: rgba(255, 51, 0, 0.1); }
        
        /* MESSAGES — RAW, LEFT BORDERS, NO BUBBLES */
        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 24px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            min-height: 0; 
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth; 
        }
        .message { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            max-width: 100%; 
            animation: fadeIn 0.15s ease; 
            padding: 4px 0; 
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .message-username { 
            font-size: 0.6rem; 
            font-weight: 500; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            opacity: 0.5;
            font-family: monospace;
        }
        .message.Litheral .message-username { color: var(--primary-orange); }
        .message.user .message-username { color: var(--text-secondary); text-align: right; }
        
        .message-bubble { 
            line-height: 1.5; 
            font-size: 0.85rem; 
            max-width: 100%; 
            word-wrap: break-word; 
            white-space: pre-wrap; 
            padding: 4px 0; 
        }
        .message.Litheral .message-bubble {
            border-left: 2px solid var(--primary-orange);
            padding-left: 12px;
            color: #ddd;
        }
        .message.user .message-bubble {
            text-align: right;
            border-right: 2px solid var(--primary-orange);
            padding-right: 12px;
            color: var(--primary-orange);
        }
        
        .message-actions { 
            display: flex; 
            gap: 6px; 
            margin-top: 8px; 
            justify-content: flex-start; 
            opacity: 0.6;
        }
        .message.user .message-actions { justify-content: flex-end; }
        .action-btn { 
            background: transparent; 
            border: none; 
            padding: 4px; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
        }
        .action-btn svg { width: 14px; height: 14px; stroke: #555; stroke-width: 1.8; fill: none; }
        .action-btn:hover svg { stroke: var(--primary-orange); }
        .action-btn:active { opacity: 0.5; }
        
        .copy-toast, .success-toast { 
            position: fixed; 
            bottom: 100px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #111; 
            border: 1px solid var(--primary-orange);
            color: var(--primary-orange); 
            padding: 4px 12px; 
            font-size: 0.65rem; 
            font-family: monospace;
            z-index: 1000; 
            opacity: 0; 
            transition: opacity 0.15s; 
            pointer-events: none; 
        }
        
        .jump-to-bottom { 
            position: absolute; 
            bottom: 85px; 
            left: 50%; 
            transform: translateX(-50%);
            background: #0a0a0a; 
            border: 1px solid #333; 
            padding: 6px 12px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            cursor: pointer; 
            z-index: 20; 
            transition: none; 
            font-size: 0.65rem; 
            font-weight: 500; 
            color: #aaa; 
            font-family: monospace;
            opacity: 0; 
            visibility: hidden; 
        }
        .jump-to-bottom.visible { opacity: 1; visibility: visible; }
        .jump-to-bottom:active { opacity: 0.6; }
        
        /* THINKING ANIMATION */
        .litheral-thinking { display: inline-flex; align-items: center; gap: 8px; }
        .thinking-ring svg { width: 18px; animation: pulse 1s ease infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .thinking-text { color: var(--primary-orange); font-size: 0.7rem; font-family: monospace; }
        .typing-active::after { content: "_"; display: inline-block; color: var(--primary-orange); margin-left: 2px; animation: blink 0.8s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        /* INPUT — TERMINAL STYLE */
        .chat-input-area { 
            padding: 12px 20px calc(20px + var(--safe-area-inset-bottom)); 
            background: #000000; 
            flex-shrink: 0; 
            border-top: 1px solid #151515; 
        }
        .terminal-line {
            display: flex;
            align-items: baseline;
            gap: 12px;
            background: #050505;
            padding: 10px 0;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
        }
        .terminal-prompt {
            color: var(--primary-orange);
            font-family: monospace;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .chat-input { 
            flex: 1; 
            padding: 6px 0; 
            background: transparent; 
            border: none; 
            color: var(--text-main); 
            font-size: 0.85rem; 
            outline: none; 
            font-family: 'SF Mono', 'Fira Code', monospace; 
            min-width: 0; 
            resize: none; 
            line-height: 1.4; 
        }
        .chat-input::placeholder { color: #2a2a2a; font-size: 0.8rem; font-family: monospace; }
        .send-button { 
            background: transparent; 
            border: none; 
            cursor: pointer; 
            padding: 4px 8px; 
            color: var(--primary-orange); 
            font-weight: 500; 
            font-size: 0.7rem; 
            font-family: monospace;
            transition: none;
        }
        .send-button:active { opacity: 0.5; }
        .send-button:disabled { opacity: 0.2; cursor: not-allowed; }
        .mic-button { 
            background: transparent; 
            border: none; 
            padding: 4px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
        }
        .mic-button svg { stroke: #555; }
        .mic-button:active svg { stroke: var(--primary-orange); }
        
        .rate-limit-warning { 
            font-size: 0.6rem; 
            color: var(--text-secondary); 
            text-align: left; 
            margin-top: 8px; 
            font-family: monospace;
            padding-left: 28px;
        }
        
        .voice-message-temp { transition: opacity 0.2s ease; }
        .voice-message-temp.fade-out { opacity: 0; }
        
        /* MODALS — RAW */
        .custom-modal, .delete-modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background: rgba(0,0,0,0.95); 
            z-index: 200; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            opacity: 0; 
            visibility: hidden; 
            transition: none; 
        }
        .custom-modal.open, .delete-modal.open { opacity: 1; visibility: visible; }
        .modal-content { 
            background: #050505; 
            border: 1px solid #222; 
            padding: 24px; 
            width: 300px; 
        }
        .modal-content h3 { color: var(--primary-orange); margin-bottom: 16px; font-size: 0.9rem; font-family: monospace; }
        .modal-content p { color: var(--text-secondary); margin-bottom: 20px; font-size: 0.75rem; font-family: monospace; }
        .modal-input { 
            width: 100%; 
            background: #0a0a0a; 
            border: 1px solid #222; 
            padding: 10px; 
            color: white; 
            font-size: 0.8rem; 
            outline: none; 
            font-family: monospace;
            margin-bottom: 20px; 
        }
        .modal-input:focus { border-color: var(--primary-orange); }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-btn { 
            padding: 6px 14px; 
            font-weight: 500; 
            cursor: pointer; 
            border: none; 
            font-family: monospace;
            font-size: 0.7rem;
            transition: none;
            background: transparent;
        }
        .modal-btn.cancel { color: #666; border: 1px solid #333; }
        .modal-btn.confirm { background: var(--primary-orange); color: black; border: 1px solid var(--primary-orange); }
        .modal-btn.danger { color: #ff4444; border: 1px solid #ff4444; background: transparent; }
        .modal-btn:active { opacity: 0.6; }

        .fade-out-message { animation: fadeOutMsg 0.3s ease forwards; }
        @keyframes fadeOutMsg { 0% { opacity: 1; } 100% { opacity: 0; display: none; } }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 100; background: #020202; }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 90; opacity: 0; visibility: hidden; transition: none; }
            .overlay.open { opacity: 1; visibility: visible; }
            .chat-messages { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">>_ summoning clarity...</div>
</div>

<div class="app-layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">+ new session</button>
        </div>
        <div class="sessions-list" id="sessionsList"></div>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="chat-container">
        <div class="chat-header">
            <button class="menu-toggle" id="menuToggle">≡</button>
            <div class="header-left"><div class="header-logo"></div><h1>LITHERAL</h1></div>
            <div class="balance-container"><span class="balance-label">credits</span><span class="balance-amount" id="balanceAmount">0.00</span><button class="buy-coins-btn" id="buyCoinsBtn">+</button></div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>

                <textarea class="chat-input" id="chatInput" placeholder="_" autocomplete="off" rows="1"></textarea>
                <button class="mic-button" id="micButton"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 16C14.21 16 16 14.21 16 12V6C16 3.79 14.21 2 12 2C9.79 2 8 3.79 8 6V12C8 14.21 9.79 16 12 16Z" stroke="currentColor" stroke-width="1.5"/><path d="M5 12C5 15.86 8.14 19 12 19C15.86 19 19 15.86 19 12" stroke="currentColor" stroke-width="1.5"/><path d="M12 22V19" stroke="currentColor" stroke-width="1.5"/></svg></button>
                <button class="send-button" id="sendButton">↵</button>
            </div>
            <div class="rate-limit-warning" id="rateLimitWarning"></div>
        </div>
    </div>
</div>
<div id="copyToast" class="copy-toast">>_ copied</div>
<div id="successToast" class="success-toast"></div>

<div id="renameModal" class="custom-modal">
    <div class="modal-content"><h3>rename session</h3><input type="text" id="renameInput" class="modal-input" placeholder="name"><div class="modal-buttons"><button class="modal-btn cancel" id="cancelRenameBtn">cancel</button><button class="modal-btn confirm" id="confirmRenameBtn">save</button></div></div>
</div>
<div id="deleteModal" class="delete-modal">
    <div class="modal-content"><h3>delete session?</h3><p>this conversation will be permanently removed.</p><div class="modal-buttons"><button class="modal-btn cancel" id="cancelDeleteBtn">cancel</button><button class="modal-btn danger" id="confirmDeleteBtn">delete</button></div></div>
</div>

            const cached = localStorage.getItem('litheral_quotes_cache');
            if (cached) {
                try {
                    const cacheData = JSON.parse(cached);
                    const cacheAge = Date.now() - cacheData.timestamp;
                    if (cacheAge < 24 * 60 * 60 * 1000) {
                        quotesCache = cacheData.quotes;
                        return quotesCache;
                    }
                } catch(e) {}
            }
            try {
                const { data, error } = await supabase.from('quotes').select('quote_text, author');
                if (!error && data && data.length > 0) {
                    quotesCache = data;
                    localStorage.setItem('litheral_quotes_cache', JSON.stringify({ quotes: data, timestamp: Date.now() }));
                    return quotesCache;
                }
            } catch(e) { console.warn(e); }
            return [{ quote_text: "clarity over comfort. truth over noise.", author: "litheral" }];
        }
        
        function getRandomQuote() {
            if (!quotesCache || quotesCache.length === 0) return { quote_text: "clarity over comfort. truth over noise.", author: "litheral" };
            const randomIndex = Math.floor(Math.random() * quotesCache.length);
            return quotesCache[randomIndex];
        }
        
        async function callAPI(endpoint, body, method='POST'){
            if(!supabaseAccessToken) throw new Error('Not authenticated');
            if(currentAbortController) currentAbortController.abort();
            currentAbortController = new AbortController();
            const options = { method, headers: { 'Authorization': `Bearer ${supabaseAccessToken}`, 'Content-Type':'application/json' }, signal: currentAbortController.signal };
            if(body && (method==='POST'||method==='PUT')) options.body = JSON.stringify(body);
            const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
            if(response.status===401){
                const { data: { session } } = await supabase.auth.refreshSession();
                if(session) supabaseAccessToken = session.access_token;
                return callAPI(endpoint, body, method);
            }
            if(response.status===429){ const err=new Error('Rate limited'); err.status=429; throw err; }
            if(response.status===402){ const err=new Error('insufficient_coins'); err.status=402; throw err; }
            if(!response.ok){ const err=new Error(`API error`); err.status=response.status; throw err; }
            return await response.json();
        }
        
        async function loadUserChatSettings() {
            if (!currentUserId) return new Map();
            try {
                const { data, error } = await supabase.from('user_chat_sessions').select('session_id, custom_name, pinned').eq('user_id', currentUserId);
                if (!error && data) {
                    const settingsMap = new Map();
                    data.forEach(item => { settingsMap.set(item.session_id, { custom_name: item.custom_name, pinned: item.pinned }); });
                    return settingsMap;
                }
            } catch(e) { console.warn(e); }
            return new Map();
        }
        
        async function saveChatNameToSupabase(sessionId, customName) {
            if (!currentUserId) return;
            try { await supabase.from('user_chat_sessions').upsert({ user_id: currentUserId, session_id: sessionId, custom_name: customName, updated_at: new Date().toISOString() }, { onConflict: 'user_id, session_id' }); } catch(e) { console.warn(e); }
        }
        
        async function savePinToSupabase(sessionId, pinned) {
            if (!currentUserId) return;
            try { await supabase.from('user_chat_sessions').upsert({ user_id: currentUserId, session_id: sessionId, pinned: pinned, updated_at: new Date().toISOString() }, { onConflict: 'user_id, session_id' }); } catch(e) { console.warn(e); }
        }
        
        function cacheSessionHistory(sessionId, messages) { try { const cache = JSON.parse(localStorage.getItem('litheral_history_cache') || '{}'); cache[sessionId] = messages; localStorage.setItem('litheral_history_cache', JSON.stringify(cache)); historyCache.set(sessionId, messages); } catch(e) {} }
        function loadCachedHistory(sessionId) { try { if (historyCache.has(sessionId)) return historyCache.get(sessionId); const cache = JSON.parse(localStorage.getItem('litheral_history_cache') || '{}'); if (cache[sessionId]) { historyCache.set(sessionId, cache[sessionId]); return cache[sessionId]; } } catch(e) {} return null; }
        
        async function fetchSessions(){
            try{ const data = await callAPI('/ai/sessions', null, 'GET');
                if(data?.sessions){ 
                    sessions = data.sessions.map(s=>({ ...s, pinned: false }));
                    const settings = await loadUserChatSettings();
                    sessions.forEach(s => {
                        const setting = settings.get(s.id);
                        if (setting) {
                            if (setting.custom_name) s.title = setting.custom_name;
                            s.pinned = setting.pinned || false;
                        }
                    });
                    sortAndRenderSessions();
                }
            }catch(e){ console.warn(e); }
        }
        
        async function createSession(title="New Chat"){
            try{ const data = await callAPI('/ai/sessions', { title });
                if(data?.session_id){
                    const newSession = { id: data.session_id, title: data.title || title, created_at: data.created_at, pinned: false };
                    sessions.unshift(newSession);
                    sortAndRenderSessions();
                    return newSession.id;
                }
            }catch(e){ return null; }
        }
        
        async function deleteSession(sessionId){
            try{ 
                await callAPI(`/ai/sessions/${sessionId}`, null, 'DELETE');
                if (currentUserId) { await supabase.from('user_chat_sessions').delete().eq('session_id', sessionId).eq('user_id', currentUserId); }
                sessions = sessions.filter(s=>s.id!==sessionId);
                historyCache.delete(sessionId);
                const cache = JSON.parse(localStorage.getItem('litheral_history_cache') || '{}');
                delete cache[sessionId];
                localStorage.setItem('litheral_history_cache', JSON.stringify(cache));
                if(activeSessionId===sessionId){
                    activeSessionId = sessions.length>0 ? sessions[0].id : null;
                    if(activeSessionId) await loadSessionHistory(activeSessionId);
                    else clearChatUI();
                }
                sortAndRenderSessions();
                showSuccessToast("session deleted");
                return true;
            }catch(e){ return false; }
        }
        
        async function renameSession(sessionId, newTitle){
            const session = sessions.find(s=>s.id===sessionId);
            if(session){ 
                session.title = newTitle; 
                sortAndRenderSessions(); 
                await saveChatNameToSupabase(sessionId, newTitle);
            }
        }
        
        async function togglePin(sessionId){
            const session = sessions.find(s=>s.id===sessionId);
            if(session){ session.pinned = !session.pinned; await savePinToSupabase(sessionId, session.pinned); sortAndRenderSessions(); }
        }
        
        function sortAndRenderSessions(){
            const pinned = sessions.filter(s=>s.pinned).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            const unpinned = sessions.filter(s=>!s.pinned).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
            renderSessionsList([...pinned, ...unpinned]);
        }
        
        const pinIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L15 8.5L22 9.5L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9.5L9 8.5L12 2z"/></svg>';
        const renameIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3L21 7L7 21H3V17L17 3Z"/><path d="M15 5L19 9"/></svg>';
        const deleteIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-13"/><path d="M9 4h6v3H9z"/></svg>';
        
        function renderSessionsList(sessionArray){
            if(!sessionsList) return;
            sessionsList.innerHTML = '';
            sessionArray.forEach(session=>{
                const div = document.createElement('div'); div.className = `session-item ${activeSessionId===session.id?'active':''}`;
                div.innerHTML = `<div class="session-info"><div class="session-title">${escapeHtml(session.title)} ${session.pinned?'<span class="session-pinned">'+pinIcon+'</span>':''}</div><div class="session-date">${new Date(session.created_at).toLocaleDateString()}</div></div>
                    <div class="session-actions"><button class="session-action-btn rename-btn" data-id="${session.id}" title="rename">${renameIcon}</button><button class="session-action-btn pin-btn ${session.pinned?'pinned':''}" data-id="${session.id}" title="pin">${pinIcon}</button><button class="session-action-btn delete-btn" data-id="${session.id}" title="delete">${deleteIcon}</button></div>`;
                div.addEventListener('click',(e)=>{ if(e.target.classList.contains('session-action-btn') || e.target.closest('.session-action-btn')) return; switchSession(session.id); });
                sessionsList.appendChild(div);
            });
            document.querySelectorAll('.rename-btn').forEach(btn=>{ btn.addEventListener('click',(e)=>{ e.stopPropagation(); const id=btn.getAttribute('data-id'); const sess=sessions.find(s=>s.id===id); if(sess) openRenameModal(id, sess.title); }); });
            document.querySelectorAll('.pin-btn').forEach(btn=>{ btn.addEventListener('click',async(e)=>{ e.stopPropagation(); await togglePin(btn.getAttribute('data-id')); }); });
            document.querySelectorAll('.delete-btn').forEach(btn=>{ btn.addEventListener('click',(e)=>{ e.stopPropagation(); const id=btn.getAttribute('data-id'); openDeleteModal(id); }); });
        }
        
        function openDeleteModal(sessionId) { pendingDeleteId = sessionId; deleteModal.classList.add('open'); }
        function closeDeleteModal() { deleteModal.classList.remove('open'); pendingDeleteId = null; }
        confirmDeleteBtn.addEventListener('click', async () => { if(pendingDeleteId) { await deleteSession(pendingDeleteId); closeDeleteModal(); } });
        cancelDeleteBtn.addEventListener('click', closeDeleteModal);
        
        function openRenameModal(sessionId, currentTitle) { pendingRenameId = sessionId; renameInput.value = currentTitle; renameModal.classList.add('open'); renameInput.focus(); renameInput.select(); }
        function closeRenameModal() { renameModal.classList.remove('open'); pendingRenameId = null; }
        confirmRenameBtn.addEventListener('click', () => { if(pendingRenameId && renameInput.value.trim()) renameSession(pendingRenameId, renameInput.value.trim()); closeRenameModal(); });
        cancelRenameBtn.addEventListener('click', closeRenameModal);
        
        const editIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3L21 7L7 21H3V17L17 3Z"/><path d="M15 5L19 9"/></svg>';
        const copyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        const shareIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
        const staticRetryIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';
        
        function addUserMessage(content, showActions=true){
            const msgDiv = document.createElement('div'); msgDiv.className='message user';
            msgDiv.innerHTML = `<div class="message-username">you</div><div class="message-bubble">${escapeHtml(content)}</div>`;
            if(showActions){
                const actions = document.createElement('div'); actions.className='message-actions';
                const editBtn = document.createElement('button'); editBtn.className='action-btn'; editBtn.innerHTML=editIcon;
                editBtn.onclick=()=>{ chatInput.value=content; chatInput.focus(); chatInput.dispatchEvent(new Event('input')); };
                const copyBtn = document.createElement('button'); copyBtn.className='action-btn'; copyBtn.innerHTML=copyIcon;
                copyBtn.onclick=()=>{ navigator.clipboard.writeText(content); showCopyToast(); };
                const shareBtn = document.createElement('button'); shareBtn.className='action-btn'; shareBtn.innerHTML=shareIcon;
                shareBtn.onclick=()=>{ if(navigator.share) navigator.share({text:content}); else copyBtn.click(); };
                actions.appendChild(editBtn); actions.appendChild(copyBtn); actions.appendChild(shareBtn);
                msgDiv.appendChild(actions);
            }
            chatMessages.appendChild(msgDiv); scrollToBottom();
        }
        
        function renderMessageBatch(messages) {
            const fragment = document.createDocumentFragment();
            for (const msg of messages) {
                const msgDiv = document.createElement('div');
                if (msg.role === 'user') {
                    msgDiv.className = 'message user';
                    msgDiv.innerHTML = `<div class="message-username">you</div><div class="message-bubble">${escapeHtml(msg.content)}</div>`;
                } else {
                    msgDiv.className = 'message Litheral';
                    msgDiv.innerHTML = `<div class="message-username">litheral</div><div class="message-bubble">${escapeHtml(msg.content)}</div>`;
                }
                fragment.appendChild(msgDiv);
            }
            chatMessages.appendChild(fragment);
            scrollToBottom();
        }
        
        function showThinkingAnimation(){ if(document.getElementById('thinkingAnimation')) return; const div=document.createElement('div'); div.id='thinkingAnimation'; div.className='message Litheral'; div.innerHTML=`<div class="message-username">litheral</div><div class="message-bubble"><div class="litheral-thinking"><div class="thinking-ring"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#FF3300" stroke-width="2" stroke-dasharray="4 4"/><circle cx="12" cy="12" r="4" fill="#FF3300" fill-opacity="0.2"/></svg></div><span class="thinking-text">processing</span></div></div>`; chatMessages.appendChild(div); scrollToBottom(); }
        function hideThinkingAnimation(){ document.getElementById('thinkingAnimation')?.remove(); }
        function clearChatUI(){ chatMessages.innerHTML=''; }
        
        async function checkSessionHasMessages(sessionId) {
            const cached = loadCachedHistory(sessionId);
            if (cached && cached.length > 0) return true;
            try {
                const data = await callAPI(`/ai/history/${sessionId}`, null, 'GET');
                return data?.messages && data.messages.length > 0;
            } catch(e) { return false; }
        }
        
        async function sendToLitheralV2(userMessage){
            if(!activeSessionId){ const newId=await createSession("Chat"); if(!newId) throw new Error("No session"); activeSessionId=newId; }
            const requestBody = { message: userMessage, session_id: activeSessionId };
            const data = await callAPI('/ai/chat', requestBody);
            if(data.balance_remaining!==undefined){ currentBalance=data.balance_remaining; balanceAmountSpan.textContent=currentBalance.toFixed(4); }
            const session = sessions.find(s=>s.id===activeSessionId);
            if(session && session.title==="New Chat" && userMessage.length>3){ const newTitle = userMessage.length>30 ? userMessage.slice(0,30)+"..." : userMessage; await renameSession(activeSessionId, newTitle); }
            return data.response;
        }
        
        async function handleSendWithText(userMessage){
            if(!userMessage.trim()) return;
            sendButton.disabled=true; micButton.disabled=true;
            addUserMessage(userMessage, true);
            chatInput.value=''; chatInput.style.height='auto';
            showThinkingAnimation();
            try{
                const response = await sendToLitheralV2(userMessage);
                hideThinkingAnimation();
                await typeMessage(response, false, true);
                pendingRetryMessage=null;
                if(rateLimitCountdown){ clearInterval(rateLimitCountdown); rateLimitWarning.textContent=''; }
            } catch(error){
                hideThinkingAnimation();
                const friendly=getHumanReadableErrorMessage(error);
                await typeMessage(friendly, true, false);
                if(error.status===429){
                    pendingRetryMessage=userMessage;
                    let wait=10;
                    rateLimitWarning.textContent=`>_ rate limit — wait ${wait}s`;
                    if(rateLimitCountdown) clearInterval(rateLimitCountdown);
                    rateLimitCountdown = setInterval(()=>{ wait--; if(wait<=0){ clearInterval(rateLimitCountdown); rateLimitWarning.textContent=''; sendButton.disabled=false; micButton.disabled=false; if(pendingRetryMessage) handleSendWithText(pendingRetryMessage); } else rateLimitWarning.textContent=`>_ rate limit — wait ${wait}s`; },1000);
                    return;
                }
            } finally {
                if(!rateLimitCountdown){ sendButton.disabled=false; micButton.disabled=false; }
            }
        }
        
        function typeMessage(text, isError=false, showActions=true){
            return new Promise((resolve)=>{
                const messageDiv = document.createElement('div'); messageDiv.className='message Litheral';
                messageDiv.innerHTML = `<div class="message-username">litheral</div><div class="message-bubble typing-active"></div>`;
                const bubble = messageDiv.querySelector('.message-bubble');
                if(isError) bubble.style.color='#ff6666';
                chatMessages.appendChild(messageDiv);
                let i=0;
                function typeChar(){
                    if(i<text.length){
                        bubble.textContent += text[i];
                        scrollToBottom(); i++;
                        typingAnimationFrame = setTimeout(typeChar, 25);
                    } else {
                        bubble.classList.remove('typing-active');
                        clearTimeout(typingAnimationFrame);
                        if(showActions && !isError){
                            const actionsDiv = document.createElement('div'); actionsDiv.className='message-actions';
                            const retryBtn = document.createElement('button'); retryBtn.className='action-btn static-retry'; retryBtn.innerHTML=staticRetryIcon;
                            const copyBtn = document.createElement('button'); copyBtn.className='action-btn'; copyBtn.innerHTML=copyIcon;
                            const shareBtn = document.createElement('button'); shareBtn.className='action-btn'; shareBtn.innerHTML=shareIcon;
                            copyBtn.onclick=()=>{ navigator.clipboard.writeText(text); showCopyToast(); };
                            shareBtn.onclick=()=>{ if(navigator.share) navigator.share({text}); else copyBtn.click(); };
                            retryBtn.onclick=async()=>{ const lastUser=[...chatMessages.querySelectorAll('.message.user')].pop(); if(lastUser){ const original=lastUser.querySelector('.message-bubble')?.textContent; if(original){ messageDiv.remove(); showThinkingAnimation(); try{ const newResp=await sendToLitheralV2(original); hideThinkingAnimation(); await typeMessage(newResp,false,true); }catch(err){ hideThinkingAnimation(); await typeMessage(getHumanReadableErrorMessage(err),true,false); } } } };
                            actionsDiv.appendChild(retryBtn); actionsDiv.appendChild(copyBtn); actionsDiv.appendChild(shareBtn);
                            messageDiv.appendChild(actionsDiv);
                        }
                        resolve();
                    }
                }
                typeChar();
            });
        }
        
        async function loadSessionHistory(sessionId){
            if(!sessionId) return;
            const cached = loadCachedHistory(sessionId);
            if (cached && cached.length > 0) {
                clearChatUI();
                renderMessageBatch(cached);
                fetchAndUpdateCache(sessionId);
                return;
            }
            try{
                const data = await callAPI(`/ai/history/${sessionId}`, null, 'GET');
                if(data?.messages && data.messages.length){
                    clearChatUI();
                    renderMessageBatch(data.messages);
                    cacheSessionHistory(sessionId, data.messages);
                }
            } catch(e){ console.warn(e); }
        }
        
        async function fetchAndUpdateCache(sessionId){ try{ const data = await callAPI(`/ai/history/${sessionId}`, null, 'GET'); if(data?.messages){ cacheSessionHistory(sessionId, data.messages); } } catch(e){} }
        
        async function switchSession(sessionId){ 
            activeSessionId = sessionId; 
            sortAndRenderSessions(); 
            await loadSessionHistory(sessionId); 
            emptySessionClickCount = 0;
            if(warningMessageDiv) { warningMessageDiv.remove(); warningMessageDiv = null; if(warningTimeout) clearTimeout(warningTimeout); }
            if(window.innerWidth<=768) closeSidebar(); 
        }
        
        async function createNewChat(){ 
            const hasMessages = await checkSessionHasMessages(activeSessionId);
            
            if (hasMessages) {
                const newId = await createSession("untitled");
                if (newId) { 
                    activeSessionId = newId; 
                    clearChatUI(); 
                    sortAndRenderSessions(); 
                    const randomQuote = getRandomQuote();
                    await typeMessage(`${randomQuote.quote_text} — ${randomQuote.author}`, false, false); 
                    scrollToBottom(); 
                }
                emptySessionClickCount = 0;
                if(warningMessageDiv) { warningMessageDiv.remove(); warningMessageDiv = null; if(warningTimeout) clearTimeout(warningTimeout); }
            } else {
                emptySessionClickCount++;
                
                if (emptySessionClickCount === 1) {
                    if (warningMessageDiv) { warningMessageDiv.remove(); if(warningTimeout) clearTimeout(warningTimeout); }
                    warningMessageDiv = document.createElement('div');
                    warningMessageDiv.className = 'message Litheral';
                    warningMessageDiv.innerHTML = `<div class="message-username">litheral</div><div class="message-bubble">>_ you're already in a fresh session. start typing.</div>`;
                    chatMessages.appendChild(warningMessageDiv);
                    scrollToBottom();
                    warningTimeout = setTimeout(() => {
                        if (warningMessageDiv) {
                            warningMessageDiv.classList.add('fade-out-message');
                            setTimeout(() => { if (warningMessageDiv) warningMessageDiv.remove(); warningMessageDiv = null; }, 300);
                        }
                    }, 2500);
                } 
                else if (emptySessionClickCount === 3) {
                    const voiceMessage = `${userName}, you're already in a fresh conversation. type when ready.`;
                    showVoiceMessage(voiceMessage, true);
                    const quickMsg = document.createElement('div');
                    quickMsg.className = 'message Litheral voice-message-temp';
                    quickMsg.innerHTML = `<div class="message-username">litheral</div><div class="message-bubble">${voiceMessage}</div>`;
                    chatMessages.appendChild(quickMsg);
                    scrollToBottom();
                    setTimeout(() => { quickMsg.classList.add('fade-out'); setTimeout(() => quickMsg.remove(), 300); }, 3500);
                }
            }
            if(window.innerWidth<=768) closeSidebar(); 
        }
        
        function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); }
        function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('open'); }
        
        async function initAuth(){
            const { data:{ session } } = await supabase.auth.getSession();
            if(session) { supabaseAccessToken = session.access_token; currentUserId = session.user.id; }
            else { const {data}=await supabase.auth.signInAnonymously(); supabaseAccessToken=data.session.access_token; currentUserId = data.session.user.id; }
            const {data:{user}}=await supabase.auth.getUser();
            if(user){ 
                const {data:profile}=await supabase.from('profile').select('first_name').eq('id',user.id).single(); 
                userName = profile?.first_name || user.email?.split('@')[0] || 'there';
            }
        }
        
        async function init(){
            loadingScreen.classList.remove('hide');
            await fetchAndCacheQuotes();
            await initAuth();
            await fetchSessions();
            
            const greeting = getTimeBasedGreeting();
            const randomQuote = getRandomQuote();
            
            if (sessions.length === 0) {
                const newId = await createSession("untitled");
                if (newId) {
                    activeSessionId = newId;
                    await typeMessage(`${greeting}, ${userName}. ${randomQuote.quote_text} — ${randomQuote.author}`, false, false);
                }
            } else {
                const mostRecentSession = sessions[0];
                activeSessionId = mostRecentSession.id;
                const hasMessages = await checkSessionHasMessages(activeSessionId);
                
                if (hasMessages) {
                    const newId = await createSession("untitled");
                    if (newId) {
                        activeSessionId = newId;
                        await typeMessage(`${greeting}, ${userName}. ${randomQuote.quote_text} — ${randomQuote.author}`, false, false);
                    }
                } else {
                    await loadSessionHistory(activeSessionId);
                    if (chatMessages.children.length === 0) {
                        await typeMessage(`${greeting}, ${userName}. ${randomQuote.quote_text} — ${randomQuote.author}`, false, false);
                    }
                }
            }
            
            try{ const data=await callAPI('/coins/balance',null,'GET'); if(data?.balance!==undefined){ currentBalance=data.balance; balanceAmountSpan.textContent=currentBalance.toFixed(4); } } catch(e){}
            
            sendButton.disabled=false; micButton.disabled=false;
            setTimeout(() => { loadingScreen.classList.add('hide'); }, 200);
        }
        
        chatInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); handleSendWithText(chatInput.value.trim()); } });
        sendButton.addEventListener('click',()=>{ handleSendWithText(chatInput.value.trim()); });
        micButton.addEventListener('click',handleVoiceClick);
        newChatBtn.addEventListener('click',createNewChat);
        menuToggle.addEventListener('click',openSidebar);
        overlay.addEventListener('click',closeSidebar);
        document.getElementById('buyCoinsBtn').addEventListener('click',()=>window.location.href='/Tokens');
        chatMessages.addEventListener('scroll',()=>{ const nearBottom=chatMessages.scrollHeight-chatMessages.scrollTop-chatMessages.clientHeight<150; if(!nearBottom) jumpBtn.classList.add('visible'); else jumpBtn.classList.remove('visible'); });
        jumpBtn.addEventListener('click',()=>{ chatMessages.scrollTo({ top:chatMessages.scrollHeight, behavior:'smooth' }); jumpBtn.classList.remove('visible'); });
        window.addEventListener('beforeunload',()=>{ if(currentAbortController) currentAbortController.abort(); if(typingAnimationFrame) clearTimeout(typingAnimationFrame); if(rateLimitCountdown) clearInterval(rateLimitCountdown); window.speechSynthesis.cancel(); });
        init();
    })();
</script>
</body>
</html>
