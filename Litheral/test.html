<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Litheral — clarity over noise</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6600'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6600;
            --primary-hover: #e05a00;
            --primary-light: rgba(255, 102, 0, 0.1);
            --user-message-bg: #ffe4e1;
            --user-message-text: #1a1a1a;
            --bg-primary: #ffffff;
            --bg-secondary: #f7f7f8;
            --bg-tertiary: #f0f0f2;
            --border-light: #e5e5e5;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #8e8e93;
            --sidebar-width: 280px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --user-message-bg: #3a2a2a;
                --user-message-text: #f5f5f7;
                --bg-primary: #0f0f13;
                --bg-secondary: #1a1a1e;
                --bg-tertiary: #252528;
                --border-light: #2c2c30;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #6c6c70;
            }
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, 'Inter', 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 500;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }
        .loading-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-spinner { width: 44px; height: 44px; border: 3px solid var(--border-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; }

        .app-layout { display: flex; height: 100%; width: 100%; overflow: hidden; }
        
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.25s ease;
            z-index: 30;
            flex-shrink: 0;
        }
        .sidebar-header { padding: 20px 16px; border-bottom: 1px solid var(--border-light); }
        .new-chat-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 32px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover { background: var(--primary-hover); }
        .new-chat-btn:active { transform: scale(0.98); }
        
        .sessions-list { flex: 1; overflow-y: auto; padding: 12px; }
        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            background: transparent;
        }
        .session-item.active { background: var(--primary-light); }
        .session-item:hover { background: var(--bg-tertiary); }
        .session-info { flex: 1; min-width: 0; }
        .session-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-date {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
        .session-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
        .session-item:hover .session-actions { opacity: 1; }
        .session-action-btn {
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: background 0.15s;
        }
        .session-action-btn:hover { background: var(--bg-tertiary); color: var(--primary); }
        .session-action-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .pin-btn.pinned { color: var(--primary); }

        .chat-container {
            flex: 1;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--bg-primary);
        }
        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 12px;
            color: var(--text-primary);
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; }
        .chat-header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
        }
        .balance-container {
            background: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
        }
        .balance-amount {
            color: var(--primary);
            font-weight: 800;
            font-size: 1rem;
        }
        .buy-coins-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 5px 14px;
            border-radius: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .buy-coins-btn:hover { background: var(--primary-hover); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; }
        .message-username {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-tertiary);
        }
        .message.Litheral .message-username { color: var(--primary); }
        .message.user .message-username { text-align: right; }
        
        .message-bubble {
            padding: 12px 18px;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.Litheral .message-bubble {
            background: var(--bg-secondary);
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }
        .message.user .message-bubble {
            background: var(--user-message-bg);
            color: var(--user-message-text);
            border-bottom-right-radius: 6px;
        }
        
        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity 0.15s;
            justify-content: flex-start;
        }
        .message:hover .message-actions { opacity: 1; }
        .action-btn {
            background: transparent;
            border: none;
            padding: 6px;
            cursor: pointer;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: background 0.15s, color 0.15s;
        }
        .action-btn:hover { background: var(--bg-tertiary); color: var(--primary); }
        .action-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; }

        .copy-toast, .success-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        .jump-to-bottom {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 20;
            transition: all 0.2s;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            opacity: 0;
            visibility: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .jump-to-bottom.visible { opacity: 1; visibility: visible; }
        .jump-to-bottom:hover { background: var(--bg-tertiary); }

        .litheral-clarifying {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .clarifying-dots {
            display: flex;
            gap: 5px;
        }
        .clarifying-dots span {
            width: 7px;
            height: 7px;
            background: var(--primary);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .clarifying-dots span:nth-child(1) { animation-delay: -0.32s; }
        .clarifying-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .clarifying-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }
        .typing-active::after {
            content: "▊";
            display: inline-block;
            color: var(--primary);
            margin-left: 2px;
            animation: blink 0.8s step-start infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* NEW INPUT AREA - message as a line above mic and send button */
        .chat-input-area {
            padding: 16px 20px calc(20px + var(--safe-bottom));
            background: var(--bg-primary);
            flex-shrink: 0;
            border-top: 1px solid var(--border-light);
        }
        /* Message input as a full-width line above */
        .message-input-line {
            width: 100%;
            margin-bottom: 12px;
        }
        .chat-input {
            width: 100%;
            padding: 14px 0;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-light);
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            font-family: inherit;
            resize: none;
            line-height: 1.45;
            max-height: 135px;
            overflow-y: auto;
        }
        .chat-input:focus {
            border-bottom-color: var(--primary);
        }
        .chat-input::placeholder {
            color: var(--text-tertiary);
            font-weight: 400;
        }
        /* Action buttons row below the input line */
        .input-actions-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }
        .mic-button {
            background: transparent;
            border: none;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 50%;
            color: var(--text-tertiary);
            transition: background 0.15s, color 0.15s;
        }
        .mic-button:hover { background: var(--bg-tertiary); color: var(--primary); }
        .mic-button svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        .send-button {
            background: var(--primary);
            border: none;
            cursor: pointer;
            padding: 10px 22px;
            color: white;
            font-weight: 800;
            font-size: 0.9rem;
            border-radius: 40px;
            transition: background 0.2s;
        }
        .send-button:hover { background: var(--primary-hover); }
        .send-button:disabled { opacity: 0.5; cursor: not-allowed; }
        .rate-limit-warning {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-tertiary);
            text-align: center;
            margin-top: 12px;
        }

        .voice-message-temp { transition: opacity 0.3s ease; }
        .voice-message-temp.fade-out { opacity: 0; }

        .custom-modal, .delete-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }
        .custom-modal.open, .delete-modal.open { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            border-radius: 28px;
            padding: 28px;
            width: 360px;
            max-width: 85vw;
        }
        .modal-content h3 {
            color: var(--text-primary);
            margin-bottom: 16px;
            font-size: 1.2rem;
            font-weight: 800;
        }
        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .modal-input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 18px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            margin-bottom: 20px;
        }
        .modal-input:focus { border-color: var(--primary); }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-btn {
            padding: 10px 18px;
            border-radius: 28px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
            font-size: 0.85rem;
        }
        .modal-btn.cancel {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
        }
        .modal-btn.confirm { background: var(--primary); color: white; }
        .modal-btn.danger { background: #dc2626; color: white; }
        .modal-btn:active { transform: scale(0.96); }

        .fade-out-message {
            animation: fadeOutMsg 0.3s ease forwards;
        }
        @keyframes fadeOutMsg {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); display: none; }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                z-index: 100;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-toggle { display: block; }
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 90;
                opacity: 0;
                visibility: hidden;
                transition: all 0.25s;
            }
            .overlay.open { opacity: 1; visibility: visible; }
            .chat-messages { padding: 16px; }
            .chat-header { padding: 12px 16px; }
            .chat-input-area { padding: 12px 16px calc(16px + var(--safe-bottom)); }
            .message-bubble { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Litheral...</div>
</div>

<div class="app-layout">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>
        </div>
        <div class="sessions-list" id="sessionsList"></div>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="chat-container">
        <div class="chat-header">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="header-left"><div class="header-logo"></div><h1>Litheral</h1></div>
            <div class="balance-container"><span class="balance-label">credits</span><span class="balance-amount" id="balanceAmount">0.00</span><button class="buy-coins-btn" id="buyCoinsBtn">add</button></div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <button class="jump-to-bottom" id="jumpToBottomBtn">↓ New messages</button>
        <div class="chat-input-area">
            <div class="message-input-line">
                <textarea class="chat-input" id="chatInput" placeholder="Ask anything..." autocomplete="off" rows="1"></textarea>
            </div>
            <div class="input-actions-row">
                <button class="mic-button" id="micButton"><svg viewBox="0 0 24 24" fill="none"><path d="M12 16C14.21 16 16 14.21 16 12V6C16 3.79 14.21 2 12 2C9.79 2 8 3.79 8 6V12C8 14.21 9.79 16 12 16Z" stroke="currentColor" stroke-width="1.5"/><path d="M5 12C5 15.86 8.14 19 12 19C15.86 19 19 15.86 19 12" stroke="currentColor" stroke-width="1.5"/><path d="M12 22V19" stroke="currentColor" stroke-width="1.5"/></svg></button>
                <button class="send-button" id="sendButton">Send</button>
            </div>
            <div class="rate-limit-warning" id="rateLimitWarning"></div>
        </div>
    </div>
</div>
<div id="copyToast" class="copy-toast">Copied!</div>
<div id="successToast" class="success-toast"></div>

<div id="renameModal" class="custom-modal">
    <div class="modal-content"><h3>Rename chat</h3><input type="text" id="renameInput" class="modal-input" placeholder="Chat name"><div class="modal-buttons"><button class="modal-btn cancel" id="cancelRenameBtn">Cancel</button><button class="modal-btn confirm" id="confirmRenameBtn">Save</button></div></div>
</div>
<div id="deleteModal" class="delete-modal">
    <div class="modal-content"><h3>Delete chat?</h3><p>This conversation will be permanently removed.</p><div class="modal-buttons"><button class="modal-btn cancel" id="cancelDeleteBtn">Cancel</button><button class="modal-btn danger" id="confirmDeleteBtn">Delete</button></div></div>
</div>

                    placeholderTimer = setTimeout(updateStep, 70);
                } else {
                    placeholderTimer = setTimeout(()=>{ isDeleting = true; updateStep(); }, 2800);
                }
            } else {
                if(currentDisplayLength > 0){
                    currentDisplayLength--;
                    chatInput.placeholder = currentPlaceholderText.substring(0, currentDisplayLength);
                    placeholderTimer = setTimeout(updateStep, 45);
                } else {
                    currentPhraseIndex = (currentPhraseIndex + 1) % placeholderPhrases.length;
                    currentPlaceholderText = placeholderPhrases[currentPhraseIndex];
                    isDeleting = false;
                    placeholderTimer = setTimeout(updateStep, 300);
                }
            }
        }
        currentPlaceholderText = placeholderPhrases[currentPhraseIndex];
        currentDisplayLength = 0;
        isDeleting = false;
        updateStep();
    }

        if (cached) {
            try {
                const cacheData = JSON.parse(cached);
                const cacheAge = Date.now() - cacheData.timestamp;
                if (cacheAge < 24 * 60 * 60 * 1000) {
                    quotesCache = cacheData.quotes;
                    return quotesCache;
                }
            } catch(e) {}
        }
        try {
            const { data, error } = await supabase.from('quotes').select('quote_text, author');
            if (!error && data && data.length > 0) {
                quotesCache = data;
                localStorage.setItem('litheral_quotes_cache', JSON.stringify({ quotes: data, timestamp: Date.now() }));
                return quotesCache;
            }
        } catch(e) { console.warn(e); }
        return [{ quote_text: "Clarity is power. Truth over comfort.", author: "Litheral" }];
    }

        if (!quotesCache || quotesCache.length === 0) return { quote_text: "Clarity is power. Truth over comfort.", author: "Litheral" };
        const randomIndex = Math.floor(Math.random() * quotesCache.length);
        return quotesCache[randomIndex];

    async function callAPI(endpoint, body, method='POST'){
        if(!supabaseAccessToken) throw new Error('Not authenticated');
        if(currentAbortController) currentAbortController.abort();
        currentAbortController = new AbortController();
        const options = { 
            method, 
            headers: { 'Authorization': `Bearer ${supabaseAccessToken}`, 'Content-Type':'application/json' }, 
            signal: currentAbortController.signal 
        };
        if(body && (method==='POST'||method==='PUT')) options.body = JSON.stringify(body);
        const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
        if(response.status === 401){
            const { data: { session } } = await supabase.auth.refreshSession();
            if(session) supabaseAccessToken = session.access_token;
            return callAPI(endpoint, body, method);
        }
        if(response.status === 429){ const err = new Error('Rate limited'); err.status = 429; throw err; }
        if(response.status === 402){ const err = new Error('insufficient_coins'); err.status = 402; throw err; }
        if(!response.ok){ const err = new Error(`API error`); err.status = response.status; throw err; }
        return await response.json();
    }

    async function fetchSessions(){
        try{ 
            const data = await callAPI('/ai/sessions', null, 'GET');
            if(data?.sessions){ 
                sessions = data.sessions.map(s=>({ ...s, pinned: false }));
                const settings = await loadUserChatSettings();
                sessions.forEach(s => {
                    const setting = settings.get(s.id);
                    if (setting) {
                        if (setting.custom_name) s.title = setting.custom_name;
                        s.pinned = setting.pinned || false;
                    }
                });
                sortAndRenderSessions();
            }
        }catch(e){ console.warn(e); }
    }
    
    async function createSession(title="New Chat"){
        try{ 
            const data = await callAPI('/ai/sessions', { title });
            if(data?.session_id){
                const newSession = { id: data.session_id, title: data.title || title, created_at: data.created_at, pinned: false };
                sessions.unshift(newSession);
                sortAndRenderSessions();
                return newSession.id;
            }
        }catch(e){ return null; }
    }
    
    async function deleteSession(sessionId){
        try{ 
            await callAPI(`/ai/sessions/${sessionId}`, null, 'DELETE');
            if (currentUserId) { 
                await supabase.from('user_chat_sessions').delete().eq('session_id', sessionId).eq('user_id', currentUserId); 
            }
            sessions = sessions.filter(s=>s.id !== sessionId);
            historyCache.delete(sessionId);
            const cache = JSON.parse(localStorage.getItem('litheral_history_cache') || '{}');
            delete cache[sessionId];
            localStorage.setItem('litheral_history_cache', JSON.stringify(cache));
            if(activeSessionId === sessionId){
                activeSessionId = sessions.length > 0 ? sessions[0].id : null;
                if(activeSessionId) await loadSessionHistory(activeSessionId);
                else clearChatUI();
            }
            sortAndRenderSessions();
            showSuccessToast("Chat deleted");
            return true;
        }catch(e){ return false; }
    }

    async function sendToLitheralV2(userMessage){
        if(!activeSessionId){ 
            const newId = await createSession("Chat"); 
            if(!newId) throw new Error("No session"); 
            activeSessionId = newId; 
        }
        const requestBody = { message: userMessage, session_id: activeSessionId };
        const data = await callAPI('/ai/chat', requestBody);
        if(data.balance_remaining !== undefined){ 
            currentBalance = data.balance_remaining; 
            balanceAmountSpan.textContent = currentBalance.toFixed(4); 
        }
        const session = sessions.find(s=>s.id === activeSessionId);
        if(session && session.title === "New Chat" && userMessage.length > 3){ 
            const newTitle = userMessage.length > 30 ? userMessage.slice(0,30) + "..." : userMessage; 
            await renameSession(activeSessionId, newTitle); 
        }
        return data.response;
    }
    
    async function handleSendWithText(userMessage){
        if(!userMessage.trim()) return;
        sendButton.disabled = true;
        micButton.disabled = true;
        addUserMessage(userMessage, true);
        chatInput.value = '';
        chatInput.style.height = 'auto';
        showClarifyingAnimation();
        try{
            const response = await sendToLitheralV2(userMessage);
            hideClarifyingAnimation();
            await typeMessage(response, false, true);
            pendingRetryMessage = null;
            if(rateLimitCountdown){ clearInterval(rateLimitCountdown); rateLimitWarning.textContent = ''; }
        } catch(error){
            hideClarifyingAnimation();
            const friendly = getHumanReadableErrorMessage(error);
            await typeMessage(friendly, true, false);
            if(error.status === 429){
                pendingRetryMessage = userMessage;
                let wait = 12;
                rateLimitWarning.textContent = `Rate limited — waiting ${wait}s`;
                if(rateLimitCountdown) clearInterval(rateLimitCountdown);
                rateLimitCountdown = setInterval(() => { 
                    wait--; 
                    if(wait <= 0){ 
                        clearInterval(rateLimitCountdown); 
                        rateLimitWarning.textContent = ''; 
                        sendButton.disabled = false; 
                        micButton.disabled = false; 
                        if(pendingRetryMessage) handleSendWithText(pendingRetryMessage); 
                    } else {
                        rateLimitWarning.textContent = `Rate limited — waiting ${wait}s`;
                    }
                }, 1000);
                return;
            }
        } finally {
            if(!rateLimitCountdown){ 
                sendButton.disabled = false; 
                micButton.disabled = false; 
            }
        }
    }
    
    function typeMessage(text, isError=false, showActions=true){
        return new Promise((resolve)=>{
            const messageDiv = document.createElement('div'); 
            messageDiv.className = 'message Litheral';
            messageDiv.innerHTML = `<div class="message-username">Litheral</div><div class="message-bubble typing-active"></div>`;
            const bubble = messageDiv.querySelector('.message-bubble');
            if(isError) bubble.style.color = '#ff6666';
            chatMessages.appendChild(messageDiv);
            let i = 0;
            function typeChar(){
                if(i < text.length){
                    bubble.textContent += text[i];
                    scrollToBottom(); 
                    i++;
                    typingAnimationFrame = setTimeout(typeChar, 20);
                } else {
                    bubble.classList.remove('typing-active');
                    clearTimeout(typingAnimationFrame);
                    if(showActions && !isError){
                        const actionsDiv = document.createElement('div'); 
                        actionsDiv.className = 'message-actions';
                        const retryBtn = document.createElement('button'); 
                        retryBtn.className = 'action-btn static-retry'; 
                        retryBtn.innerHTML = staticRetryIcon;
                        const copyBtn = document.createElement('button'); 
                        copyBtn.className = 'action-btn'; 
                        copyBtn.innerHTML = copyIcon;
                        const shareBtn = document.createElement('button'); 
                        shareBtn.className = 'action-btn'; 
                        shareBtn.innerHTML = shareIcon;
                        copyBtn.onclick = () => { navigator.clipboard.writeText(text); showCopyToast(); };
                        shareBtn.onclick = () => { if(navigator.share) navigator.share({text}); else copyBtn.click(); };
                        retryBtn.onclick = async() => { 
                            const lastUser = [...chatMessages.querySelectorAll('.message.user')].pop(); 
                            if(lastUser){ 
                                const original = lastUser.querySelector('.message-bubble')?.textContent; 
                                if(original){ 
                                    messageDiv.remove(); 
                                    showClarifyingAnimation(); 
                                    try{ 
                                        const newResp = await sendToLitheralV2(original); 
                                        hideClarifyingAnimation(); 
                                        await typeMessage(newResp, false, true); 
                                    } catch(err){ 
                                        hideClarifyingAnimation(); 
                                        await typeMessage(getHumanReadableErrorMessage(err), true, false); 
                                    } 
                                } 
                            } 
                        };
                        actionsDiv.appendChild(retryBtn); 
                        actionsDiv.appendChild(copyBtn); 
                        actionsDiv.appendChild(shareBtn);
                        messageDiv.appendChild(actionsDiv);
                    }
                    resolve();
                }
            }
            typeChar();
        });
    }
    
    async function loadSessionHistory(sessionId){
        if(!sessionId) return;
        const cached = loadCachedHistory(sessionId);
        if (cached && cached.length > 0) {
            clearChatUI();
            renderMessageBatch(cached);
            fetchAndUpdateCache(sessionId);
            return;
        }
        try{
            const data = await callAPI(`/ai/history/${sessionId}`, null, 'GET');
            if(data?.messages && data.messages.length){
                clearChatUI();
                renderMessageBatch(data.messages);
                cacheSessionHistory(sessionId, data.messages);
            }
        } catch(e){ console.warn(e); }
    }
    
    async function fetchAndUpdateCache(sessionId){ 
        try{ 
            const data = await callAPI(`/ai/history/${sessionId}`, null, 'GET'); 
            if(data?.messages){ 
                cacheSessionHistory(sessionId, data.messages); 
            } 
        } catch(e){} 
    }
    
    async function switchSession(sessionId){ 
        activeSessionId = sessionId; 
        sortAndRenderSessions(); 
        await loadSessionHistory(sessionId); 
        emptySessionClickCount = 0;
        if(warningMessageDiv) {
            warningMessageDiv.remove();
            warningMessageDiv = null;
            if(warningTimeout) clearTimeout(warningTimeout);
        }
        if(window.innerWidth <= 768) closeSidebar(); 
    }
    
    async function createNewChat(){ 
        const hasMessages = await checkSessionHasMessages(activeSessionId);
        
        if (hasMessages) {
            const newId = await createSession("New Chat");
            if (newId) { 
                activeSessionId = newId; 
                clearChatUI(); 
                sortAndRenderSessions(); 
                const randomQuote = getRandomQuote();
                await typeMessage(randomQuote.quote_text + " — " + randomQuote.author, false, false); 
                scrollToBottom(); 
            }
            emptySessionClickCount = 0;
            if(warningMessageDiv) {
                warningMessageDiv.remove();
                warningMessageDiv = null;
                if(warningTimeout) clearTimeout(warningTimeout);
            }
        } else {
            emptySessionClickCount++;
            
            if (emptySessionClickCount === 1) {
                if(warningMessageDiv) {
                    warningMessageDiv.remove();
                    if(warningTimeout) clearTimeout(warningTimeout);
                }
                warningMessageDiv = document.createElement('div');
                warningMessageDiv.className = 'message Litheral';
                warningMessageDiv.innerHTML = `<div class="message-username">Litheral</div><div class="message-bubble">You're already in a fresh chat. Start typing when you're ready.</div>`;
                chatMessages.appendChild(warningMessageDiv);
                scrollToBottom();
                
                warningTimeout = setTimeout(() => {
                    if(warningMessageDiv) {
                        warningMessageDiv.classList.add('fade-out-message');
                        setTimeout(() => {
                            if(warningMessageDiv) warningMessageDiv.remove();
                            warningMessageDiv = null;
                        }, 300);
                    }
                }, 3000);
            } 
            else if (emptySessionClickCount === 3) {
                const voiceMessage = `${userName}, you're already in a fresh conversation. Ask me anything when you're ready.`;
                showVoiceMessage(voiceMessage, true);
                
                const quickMsg = document.createElement('div');
                quickMsg.className = 'message Litheral voice-message-temp';
                quickMsg.innerHTML = `<div class="message-username">Litheral</div><div class="message-bubble">${voiceMessage}</div>`;
                chatMessages.appendChild(quickMsg);
                scrollToBottom();
                setTimeout(() => {
                    quickMsg.classList.add('fade-out');
                    setTimeout(() => quickMsg.remove(), 300);
                }, 4000);
            }
        }
        if(window.innerWidth <= 768) closeSidebar(); 
    }
    
    function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('open'); }
    
    async function initAuth(){
        const { data:{ session } } = await supabase.auth.getSession();
        if(session) { 
            supabaseAccessToken = session.access_token; 
            currentUserId = session.user.id; 
        } else { 
            const {data} = await supabase.auth.signInAnonymously(); 
            supabaseAccessToken = data.session.access_token; 
            currentUserId = data.session.user.id; 
        }
        const {data:{user}} = await supabase.auth.getUser();
        if(user){ 
            const {data:profile} = await supabase.from('profile').select('first_name').eq('id',user.id).single(); 
            userName = profile?.first_name || user.email?.split('@')[0] || 'there';
        }
    }
    
    async function init(){
        loadingScreen.classList.remove('hide');
        await fetchAndCacheQuotes();
        await initAuth();
        await fetchSessions();
        
        const greeting = getTimeBasedGreeting();
        const randomQuote = getRandomQuote();
        
        if (sessions.length === 0) {
            const newId = await createSession("New Chat");
            if (newId) {
                activeSessionId = newId;
                await typeMessage(`${greeting}, ${userName}. ${randomQuote.quote_text} — ${randomQuote.author}`, false, false);
            }
        } else {
            const mostRecentSession = sessions[0];
            activeSessionId = mostRecentSession.id;
            const hasMessages = await checkSessionHasMessages(activeSessionId);
            
            if (hasMessages) {
                const newId = await createSession("New Chat");
                if (newId) {
                    activeSessionId = newId;
                    await typeMessage(`${greeting}, ${userName}. ${randomQuote.quote_text} — ${randomQuote.author}`, false, false);
                }
            } else {
                await loadSessionHistory(activeSessionId);
                if (chatMessages.children.length === 0) {
                    await typeMessage(`${greeting}, ${userName}. ${randomQuote.quote_text} — ${randomQuote.author}`, false, false);
                }
            }
        }
        
        try{ 
            const data = await callAPI('/coins/balance', null, 'GET'); 
            if(data?.balance !== undefined){ 
                currentBalance = data.balance; 
                balanceAmountSpan.textContent = currentBalance.toFixed(4); 
            } 
        } catch(e){}
        
        sendButton.disabled = false; 
        micButton.disabled = false;
        setTimeout(() => { loadingScreen.classList.add('hide'); }, 200);
    }
    
    // Enter = new line (max 5 lines), Send button sends
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const start = chatInput.selectionStart;
            const end = chatInput.selectionEnd;
            const value = chatInput.value;
            chatInput.value = value.substring(0, start) + '\n' + value.substring(end);
            chatInput.selectionStart = chatInput.selectionEnd = start + 1;
            autoResizeTextarea();
            chatInput.dispatchEvent(new Event('input'));
        }
    });
    
    sendButton.addEventListener('click', () => { 
        if (chatInput.value.trim()) {
            handleSendWithText(chatInput.value.trim());
        }
    });
    
    micButton.addEventListener('click', handleVoiceClick);
    newChatBtn.addEventListener('click', createNewChat);
    menuToggle.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    document.getElementById('buyCoinsBtn').addEventListener('click', () => window.location.href = '/Tokens');
    
    chatMessages.addEventListener('scroll', () => { 
        const nearBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 150; 
        if(!nearBottom) jumpBtn.classList.add('visible'); 
        else jumpBtn.classList.remove('visible'); 
    });
    
    jumpBtn.addEventListener('click', () => { 
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' }); 
        jumpBtn.classList.remove('visible'); 
    });
    
    window.addEventListener('beforeunload', () => { 
        if(currentAbortController) currentAbortController.abort(); 
        if(typingAnimationFrame) clearTimeout(typingAnimationFrame); 
        if(rateLimitCountdown) clearInterval(rateLimitCountdown); 
        if(placeholderTimer) clearTimeout(placeholderTimer);
        window.speechSynthesis.cancel(); 
    });
    
    init();
})();
</script>
