<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Litheral AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6600'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-orange: #FF6600;
            --bg-dark: #000000;
            --card-bg: #000000;
            --border-color: #222;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-dark);
            position: fixed;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        .chat-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Mobile-optimized header */
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--bg-dark);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 24px;
            height: 24px;
            background: var(--primary-orange);
            border-radius: 4px;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-orange);
            letter-spacing: 0.5px;
        }

        .balance-container {
            background: rgba(255, 102, 0, 0.12);
            padding: 6px 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 102, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .balance-amount {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .buy-coins-btn {
            background: var(--primary-orange);
            border: none;
            color: black;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .buy-coins-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        /* Mobile-optimized messages area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-username {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message.Litheral .message-username {
            color: var(--primary-orange);
        }

        .message.user .message-username {
            color: var(--text-main);
            text-align: right;
        }

        .message-bubble {
            line-height: 1.5;
            font-size: 0.95rem;
            max-width: 100%;
            word-wrap: break-word;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        .message.user .message-bubble {
            text-align: right;
            color: #cccccc;
        }

        /* Typing indicator */
        .typing-active::after {
            content: "▊";
            display: inline-block;
            color: var(--primary-orange);
            margin-left: 2px;
            animation: blink-cursor 0.8s step-start infinite;
        }

        @keyframes blink-cursor {
            50% { opacity: 0; }
        }

        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-orange);
            border-radius: 50%;
            animation: dot-blink 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-blink {
            0% { opacity: 0.2; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        /* Mobile-optimized input area */
        .chat-input-area {
            padding: 16px 16px calc(16px + var(--safe-area-inset-bottom));
            background: var(--bg-dark);
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 10px;
            background: #0a0a0a;
            border: 1.5px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 30px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .input-container:focus-within {
            border-color: var(--primary-orange);
            transform: scale(1.01);
        }

        .chat-input {
            flex: 1;
            padding: 6px 0;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }

        .chat-input::placeholder {
            color: #444;
            font-size: 0.9rem;
        }

        .send-button, .mic-button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .send-button:active, .mic-button:active {
            transform: scale(0.92);
        }

        .send-button {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 6px 12px;
        }

        .send-button:disabled, .mic-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #ff4444;
            font-size: 0.85rem;
            padding: 12px;
            background: rgba(255, 68, 68, 0.1);
            border-radius: 12px;
            margin: 8px 0;
            text-align: center;
        }

        .rate-limit-warning {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }

        /* Mobile-friendly scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-orange);
            border-radius: 10px;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .chat-header {
                padding: 12px 16px;
            }
            
            .chat-messages {
                padding: 16px 12px;
                gap: 20px;
            }
            
            .message-bubble {
                font-size: 0.9rem;
            }
            
            .balance-container {
                padding: 4px 10px;
            }
            
            .balance-amount {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 380px) {
            .balance-label {
                display: none;
            }
            
            .buy-coins-btn {
                padding: 3px 8px;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="header-logo"></div>
                <h1>Litheral</h1>
            </div>
            <div class="balance-container">
                <span class="balance-label">Coins:</span>
                <span class="balance-amount" id="balanceAmount">0.00</span>
                <button class="buy-coins-btn" id="buyCoinsBtn">Buy</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <div class="input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="Type a message..." autocomplete="off">
                <button class="mic-button" id="micButton">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16C14.21 16 16 14.21 16 12V6C16 3.79 14.21 2 12 2C9.79 2 8 3.79 8 6V12C8 14.21 9.79 16 12 16Z" stroke="#FF6600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 12C5 15.86 8.14 19 12 19C15.86 19 19 15.86 19 12" stroke="#FF6600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 22V19" stroke="#FF6600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="send-button" id="sendButton">Send</button>
            </div>
            <div class="rate-limit-warning" id="rateLimitWarning"></div>
        </div>
    </div>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        (function() {
            // ========== SUPABASE CONFIGURATION ==========
            // IMPORTANT: Replace these with your actual Supabase credentials
            const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // Replace with your Supabase URL
            const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // Replace with your Supabase anon key
            
            // Initialize Supabase client
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // ========== CONFIGURATION ==========
            const API_BASE_URL = 'https://sdel.onrender.com';
            
            // ========== DOM ELEMENTS ==========
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const micButton = document.getElementById('micButton');
            const balanceAmountSpan = document.getElementById('balanceAmount');
            const rateLimitWarning = document.getElementById('rateLimitWarning');
            
            // ========== STATE MANAGEMENT ==========
            let currentAbortController = null;
            let typingAnimationFrame = null;
            let chatHistory = [];
            let currentBalance = 0;
            let lastRequestTime = 0;
            let rateLimitTimeout = null;
            let supabaseAccessToken = null;
            let currentSession = null;
            
            // ========== AUTHENTICATION ==========
            async function initSupabaseAuth() {
                try {
                    // Get current session
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) throw error;
                    
                    if (session) {
                        currentSession = session;
                        supabaseAccessToken = session.access_token;
                        console.log('✅ Authenticated with Supabase');
                        return true;
                    } else {
                        // No active session, try to sign in anonymously or redirect to login
                        console.log('⚠️ No active session, attempting anonymous sign in...');
                        const { data: signInData, error: signInError } = await supabase.auth.signInAnonymously();
                        
                        if (signInError) throw signInError;
                        
                        currentSession = signInData.session;
                        supabaseAccessToken = signInData.session.access_token;
                        console.log('✅ Anonymous session created');
                        return true;
                    }
                } catch (error) {
                    console.error('❌ Auth error:', error);
                    await typeMessage('⚠️ Authentication failed. Please check your Supabase configuration.');
                    return false;
                }
            }
            
            // Listen for auth changes
            supabase.auth.onAuthStateChange(async (event, session) => {
                if (session) {
                    currentSession = session;
                    supabaseAccessToken = session.access_token;
                    console.log('Auth state changed:', event);
                    
                    if (event === 'SIGNED_IN') {
                        await fetchBalance();
                    }
                }
            });
            
            // ========== API FUNCTIONS ==========
            async function callAPI(endpoint, body, method = 'POST') {
                if (!supabaseAccessToken) {
                    throw new Error('Not authenticated');
                }
                
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                currentAbortController = new AbortController();
                
                const options = {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${supabaseAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    signal: currentAbortController.signal
                };
                
                if (body && method === 'POST') {
                    options.body = JSON.stringify(body);
                }
                
                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                    
                    if (response.status === 401) {
                        // Token expired, try to refresh session
                        const { data: { session }, error } = await supabase.auth.refreshSession();
                        if (session && !error) {
                            supabaseAccessToken = session.access_token;
                            // Retry the request
                            return callAPI(endpoint, body, method);
                        } else {
                            throw new Error('Authentication expired. Please refresh the page.');
                        }
                    }
                    
                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }
                    
                    return await response.json();
                } finally {
                    currentAbortController = null;
                }
            }
            
            async function fetchBalance() {
                try {
                    const data = await callAPI('/coins/balance', null, 'GET');
                    if (data && data.balance !== undefined) {
                        currentBalance = data.balance;
                        balanceAmountSpan.textContent = currentBalance.toFixed(4);
                        
                        if (currentBalance <= 0) {
                            showBuyCoinsPrompt();
                        }
                    }
                } catch (error) {
                    console.error('Failed to fetch balance:', error);
                    balanceAmountSpan.textContent = 'Error';
                }
            }
            
            async function sendToLitheral(userMessage) {
                // Rate limiting check
                const now = Date.now();
                const timeSinceLastRequest = now - lastRequestTime;
                if (timeSinceLastRequest < 12000) {
                    const waitSeconds = Math.ceil((12000 - timeSinceLastRequest) / 1000);
                    sendButton.disabled = true;
                    micButton.disabled = true;
                    rateLimitWarning.textContent = `⏱️ Please wait ${waitSeconds}s before sending another message`;
                    
                    if (rateLimitTimeout) clearTimeout(rateLimitTimeout);
                    rateLimitTimeout = setTimeout(() => {
                        sendButton.disabled = false;
                        micButton.disabled = false;
                        rateLimitWarning.textContent = '';
                    }, 12000 - timeSinceLastRequest);
                    
                    throw new Error('Rate limited');
                }
                
                lastRequestTime = now;
                
                const requestBody = {
                    message: userMessage,
                    chat_history: chatHistory
                };
                
                const data = await callAPI('/ai/chat', requestBody);
                
                if (data.balance_remaining !== undefined) {
                    currentBalance = data.balance_remaining;
                    balanceAmountSpan.textContent = currentBalance.toFixed(4);
                    
                    if (currentBalance <= 0) {
                        showBuyCoinsPrompt();
                    }
                }
                
                chatHistory.push(
                    { role: "user", content: userMessage },
                    { role: "model", content: data.response }
                );
                
                return data.response;
            }
            
            function showBuyCoinsPrompt() {
                const warningDiv = document.createElement('div');
                warningDiv.className = 'error-message';
                warningDiv.innerHTML = '⚠️ Insufficient coins! Please buy more to continue. ⚠️';
                chatMessages.appendChild(warningDiv);
                scrollToBottom();
                
                sendButton.disabled = true;
                micButton.disabled = true;
                
                setTimeout(() => {
                    if (warningDiv.parentNode) warningDiv.remove();
                }, 4000);
            }
            
            // ========== UI FUNCTIONS ==========
            let scrollRAF = null;
            function scrollToBottom() {
                if (scrollRAF) cancelAnimationFrame(scrollRAF);
                scrollRAF = requestAnimationFrame(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    scrollRAF = null;
                });
            }
            
            let scrollTimeout = null;
            function debouncedScroll() {
                if (scrollTimeout) clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(scrollToBottom, 50);
            }
            
            function typeMessage(text) {
                return new Promise((resolve) => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message Litheral';
                    
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'message-username';
                    nameDiv.textContent = 'Litheral';
                    
                    const bubbleDiv = document.createElement('div');
                    bubbleDiv.className = 'message-bubble typing-active';
                    
                    messageDiv.appendChild(nameDiv);
                    messageDiv.appendChild(bubbleDiv);
                    chatMessages.appendChild(messageDiv);
                    
                    let i = 0;
                    const typingSpeed = 20;
                    
                    function type() {
                        if (i < text.length) {
                            bubbleDiv.textContent += text[i];
                            debouncedScroll();
                            i++;
                            typingAnimationFrame = setTimeout(type, typingSpeed);
                        } else {
                            bubbleDiv.classList.remove('typing-active');
                            clearTimeout(typingAnimationFrame);
                            resolve();
                        }
                    }
                    type();
                });
            }
            
            function addUserMessage(content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'message-username';
                nameDiv.textContent = 'You';
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                bubbleDiv.textContent = escapeHtml(content);
                
                messageDiv.appendChild(nameDiv);
                messageDiv.appendChild(bubbleDiv);
                chatMessages.appendChild(messageDiv);
                debouncedScroll();
            }
            
            function showTypingIndicator() {
                const existing = document.getElementById('typingIndicator');
                if (existing) return;
                
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message Litheral';
                typingDiv.id = 'typingIndicator';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'message-username';
                nameDiv.textContent = 'Litheral';
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                
                const indicator = document.createElement('div');
                indicator.className = 'typing-indicator';
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'typing-dot';
                    indicator.appendChild(dot);
                }
                bubbleDiv.appendChild(indicator);
                typingDiv.appendChild(nameDiv);
                typingDiv.appendChild(bubbleDiv);
                
                chatMessages.appendChild(typingDiv);
                debouncedScroll();
            }
            
            function hideTypingIndicator() {
                const el = document.getElementById('typingIndicator');
                if (el) el.remove();
            }
            
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            // ========== MESSAGE HANDLING ==========
            async function handleSend() {
                const userMessage = chatInput.value.trim();
                if (!userMessage) return;
                
                if (currentBalance <= 0) {
                    showBuyCoinsPrompt();
                    return;
                }
                
                sendButton.disabled = true;
                micButton.disabled = true;
                
                addUserMessage(userMessage);
                showTypingIndicator();
                
                try {
                    const response = await sendToLitheral(userMessage);
                    hideTypingIndicator();
                    await typeMessage(response);
                } catch (error) {
                    hideTypingIndicator();
                    if (error.message !== 'Rate limited') {
                        await typeMessage(`⚠️ ${error.message}`);
                    }
                    console.error('Send error:', error);
                } finally {
                    sendButton.disabled = false;
                    micButton.disabled = false;
                }
                
                chatInput.value = '';
                chatInput.style.color = '#ffffff';
                
                if (currentAbortController) {
                    currentAbortController.abort();
                }
            }
            
            // ========== VOICE RECOGNITION (Coming Soon) ==========
            micButton.addEventListener('click', async () => {
                // Show "Feature coming soon" message
                const tempMessage = document.createElement('div');
                tempMessage.className = 'message Litheral';
                tempMessage.style.opacity = '0';
                tempMessage.innerHTML = `
                    <div class="message-username">Litheral</div>
                    <div class="message-bubble">🎙️ Voice input feature is coming soon! Stay tuned.</div>
                `;
                chatMessages.appendChild(tempMessage);
                
                // Fade in
                setTimeout(() => { tempMessage.style.opacity = '1'; }, 10);
                scrollToBottom();
                
                // Fade out and remove after 3 seconds
                setTimeout(() => {
                    tempMessage.style.transition = 'opacity 0.3s';
                    tempMessage.style.opacity = '0';
                    setTimeout(() => {
                        if (tempMessage.parentNode) tempMessage.remove();
                    }, 300);
                }, 3000);
            });
            
            // ========== BUY COINS ==========
            document.getElementById('buyCoinsBtn').addEventListener('click', () => {
                window.location.href = '/Tokens';
            });
            
            // ========== EVENT LISTENERS ==========
            sendButton.addEventListener('click', handleSend);
            chatInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter' && !sendButton.disabled) {
                    e.preventDefault();
                    handleSend(); 
                } 
            });
            
            // ========== INITIALIZATION ==========
            async function init() {
                // Show loading message
                const loadingMsg = document.createElement('div');
                loadingMsg.className = 'message Litheral';
                loadingMsg.innerHTML = `
                    <div class="message-username">Litheral</div>
                    <div class="message-bubble">🔐 Authenticating...</div>
                `;
                chatMessages.appendChild(loadingMsg);
                
                const authSuccess = await initSupabaseAuth();
                
                if (authSuccess) {
                    loadingMsg.remove();
                    await fetchBalance();
                    await typeMessage(`✨ Litheral is ready. Your balance: ${currentBalance.toFixed(4)} coins. Ask me anything!`);
                } else {
                    loadingMsg.innerHTML = `
                        <div class="message-username">Litheral</div>
                        <div class="message-bubble">❌ Authentication failed. Please check your Supabase configuration in the code.</div>
                    `;
                }
            }
            
            init();
            
            // ========== CLEANUP ==========
            window.addEventListener('beforeunload', () => {
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                if (typingAnimationFrame) clearTimeout(typingAnimationFrame);
                if (scrollTimeout) clearTimeout(scrollTimeout);
                if (scrollRAF) cancelAnimationFrame(scrollRAF);
                if (rateLimitTimeout) clearTimeout(rateLimitTimeout);
            });
        })();
    </script>
</body>
</html>
