<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Litheral</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6600'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        :root {
            --primary-orange: #FF6600;
            --bg-dark: #000000;
            --card-bg: #000000;
            --border-color: #222;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --soft-warning: rgba(255, 102, 0, 0.15);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-inset-top: env(safe-area-inset-top, 0px);
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-dark);
            position: fixed;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        .chat-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--bg-dark);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 24px;
            height: 24px;
            background: var(--primary-orange);
            border-radius: 4px;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-orange);
            letter-spacing: 0.5px;
        }

        .balance-container {
            background: rgba(255, 102, 0, 0.12);
            padding: 6px 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 102, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .balance-amount {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .buy-coins-btn {
            background: var(--primary-orange);
            border: none;
            color: black;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .buy-coins-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-username {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message.Litheral .message-username {
            color: var(--primary-orange);
        }

        .message.user .message-username {
            color: var(--text-main);
            text-align: right;
        }

        .message-bubble {
            line-height: 1.5;
            font-size: 0.95rem;
            max-width: 100%;
            word-wrap: break-word;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        .message.user .message-bubble {
            text-align: right;
            color: #cccccc;
        }

        /* UNIQUE LITHERAL THINKING ANIMATION - Orange Pulse Ring */
        .litheral-thinking {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .thinking-ring {
            position: relative;
            width: 24px;
            height: 24px;
        }

        .thinking-ring svg {
            width: 100%;
            height: 100%;
            animation: litheralPulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes litheralPulse {
            0% {
                transform: scale(0.8);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(0.8);
                opacity: 0.3;
            }
        }

        .thinking-text {
            color: var(--primary-orange);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: textFade 1.2s ease-in-out infinite;
        }

        @keyframes textFade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .typing-active::after {
            content: "▊";
            display: inline-block;
            color: var(--primary-orange);
            margin-left: 2px;
            animation: blink-cursor 0.8s step-start infinite;
        }

        @keyframes blink-cursor {
            50% { opacity: 0; }
        }

        /* Old typing indicator - kept for compatibility but not used */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-orange);
            border-radius: 50%;
            animation: dot-blink 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-blink {
            0% { opacity: 0.2; transform: scale(0.8); }
            20% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        .chat-input-area {
            padding: 16px 16px calc(16px + var(--safe-area-inset-bottom));
            background: var(--bg-dark);
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 10px;
            background: #0a0a0a;
            border: 1.5px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 30px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .input-container:focus-within {
            border-color: var(--primary-orange);
            transform: scale(1.01);
        }

        .chat-input {
            flex: 1;
            padding: 6px 0;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }

        .chat-input::placeholder {
            color: #444;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
        }

        .send-button, .mic-button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .send-button:active, .mic-button:active {
            transform: scale(0.92);
        }

        .send-button {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 6px 12px;
        }

        .send-button:disabled, .mic-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .soft-warning {
            color: var(--primary-orange);
            font-size: 0.85rem;
            padding: 12px;
            background: var(--soft-warning);
            border-radius: 12px;
            margin: 8px 0;
            text-align: center;
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .rate-limit-warning {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-orange);
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .chat-header {
                padding: 12px 16px;
            }
            
            .chat-messages {
                padding: 16px 12px;
                gap: 20px;
            }
            
            .message-bubble {
                font-size: 0.9rem;
            }
            
            .balance-label {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="header-logo"></div>
                <h1>Litheral</h1>
            </div>
            <div class="balance-container">
                <span class="balance-label">coins</span>
                <span class="balance-amount" id="balanceAmount">0.00</span>
                <button class="buy-coins-btn" id="buyCoinsBtn">add</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <div class="input-container">
                <input type="text" class="chat-input" id="chatInput" placeholder="" autocomplete="off">
                <button class="mic-button" id="micButton">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 16C14.21 16 16 14.21 16 12V6C16 3.79 14.21 2 12 2C9.79 2 8 3.79 8 6V12C8 14.21 9.79 16 12 16Z" stroke="#FF6600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 12C5 15.86 8.14 19 12 19C15.86 19 19 15.86 19 12" stroke="#FF6600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 22V19" stroke="#FF6600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="send-button" id="sendButton">Send</button>
            </div>
            <div class="rate-limit-warning" id="rateLimitWarning"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        (function() {
            // ========== SUPABASE CONFIGURATION ==========
            const SUPABASE_URL = 'https://lgfyrlfjoazedwymjpfc.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZnlybGZqb2F6ZWR3eW1qcGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MTc1MTksImV4cCI6MjA4MjA5MzUxOX0.g1xVMCtSkkQIu2s1pkvWwxDDvgNGbikAMkyfbZJywVw';
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            // ========== CONFIGURATION ==========
            const API_BASE_URL = 'https://sdel.onrender.com';
            
            // ========== DOM ELEMENTS ==========
            const chatMessages = document.getElementById('chatMessages');
            const chatInput = document.getElementById('chatInput');
            const sendButton = document.getElementById('sendButton');
            const micButton = document.getElementById('micButton');
            const balanceAmountSpan = document.getElementById('balanceAmount');
            const rateLimitWarning = document.getElementById('rateLimitWarning');
            
            // ========== STATE MANAGEMENT ==========
            let currentAbortController = null;
            let typingAnimationFrame = null;
            let chatHistory = [];
            let currentBalance = 0;
            let lastRequestTime = 0;
            let rateLimitTimeout = null;
            let supabaseAccessToken = null;
            let isOffline = !navigator.onLine;
            let userName = null;
            let todaysQuote = null;
            
            // ========== FETCH QUOTE FROM SUPABASE QUOTES TABLE ==========
            async function fetchDailyQuote() {
                try {
                    // Get today's date string
                    const today = new Date().toDateString();
                    const stored = localStorage.getItem('litheral_daily_quote');
                    
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (parsed.date === today) {
                            return parsed.quote;
                        }
                    }
                    
                    // Fetch random quote from Supabase quotes table
                    const { data, error } = await supabase
                        .from('quotes')
                        .select('quote_text')
                        .limit(1);
                    
                    if (error) throw error;
                    
                    let quote = null;
                    if (data && data.length > 0) {
                        // Pick random quote from results
                        const randomIndex = Math.floor(Math.random() * data.length);
                        quote = data[randomIndex].quote_text;
                    } else {
                        // Fallback quotes if table is empty
                        const fallbackQuotes = [
                            "The quality of your thoughts shapes the quality of your life.",
                            "Clarity emerges when you stop chasing noise and start listening.",
                            "Truth doesn't need validation, only observation.",
                            "Your attention is your most valuable currency. Spend it wisely.",
                            "The present moment is the only place where life actually happens.",
                            "Speak only when your words are better than silence.",
                            "Restoring sanity starts with one clear thought at a time.",
                            "The strongest force in the universe is a focused mind.",
                            "Progress happens one conversation at a time.",
                            "Small daily improvements create extraordinary results."
                        ];
                        quote = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
                    }
                    
                    // Store in localStorage for today
                    localStorage.setItem('litheral_daily_quote', JSON.stringify({
                        date: today,
                        quote: quote
                    }));
                    
                    return quote;
                } catch (error) {
                    console.error('Failed to fetch quote:', error);
                    // Fallback quote
                    return "Clarity over comfort. Truth over convenience.";
                }
            }
            
            // ========== TIME-BASED GREETING ==========
            function getTimeBasedGreeting() {
                const hour = new Date().getHours();
                if (hour < 12) return "Good morning";
                if (hour < 17) return "Good afternoon";
                return "Good evening";
            }
            
            // ========== FUN PLACEHOLDER TYPING ANIMATION ==========
            const placeholders = [
                "Think Clearly", "Clarity over noise", "Defiant Reality", 
                "Truth survives comfort", "Make the next sentence meaningful", 
                "Speak with intent", "Foolishness is a choice", "I am Litheral", 
                "Let's chat", "Restoring Sanity", "Ask me anything", 
                "What's on your mind?", "Speak freely", "No filters here"
            ];
            let placeholderIndex = 0;
            let isTyping = true;
            let currentText = "";
            let typingTimeout = null;
            
            function typePlaceholder() {
                const targetText = placeholders[placeholderIndex];
                
                if (isTyping) {
                    if (currentText.length < targetText.length) {
                        currentText = targetText.substring(0, currentText.length + 1);
                        chatInput.placeholder = currentText;
                        typingTimeout = setTimeout(typePlaceholder, 100);
                    } else {
                        isTyping = false;
                        typingTimeout = setTimeout(typePlaceholder, 3000);
                    }
                } else {
                    if (currentText.length > 0) {
                        currentText = currentText.substring(0, currentText.length - 1);
                        chatInput.placeholder = currentText;
                        typingTimeout = setTimeout(typePlaceholder, 50);
                    } else {
                        placeholderIndex = (placeholderIndex + 1) % placeholders.length;
                        isTyping = true;
                        typingTimeout = setTimeout(typePlaceholder, 500);
                    }
                }
            }
            
            typePlaceholder();
            
            // ========== FETCH USER PROFILE ==========
            async function fetchUserProfile() {
                try {
                    const { data: { user }, error: userError } = await supabase.auth.getUser();
                    if (userError) throw userError;
                    
                    if (user) {
                        const { data: profile, error: profileError } = await supabase
                            .from('profile')
                            .select('first_name')
                            .eq('id', user.id)
                            .single();
                        
                        if (profileError && profileError.code !== 'PGRST116') {
                            console.error('Profile fetch error:', profileError);
                        }
                        
                        if (profile && profile.first_name) {
                            userName = profile.first_name;
                        } else {
                            userName = user.email ? user.email.split('@')[0] : 'there';
                        }
                    } else {
                        userName = 'there';
                    }
                } catch (error) {
                    console.error('Failed to fetch profile:', error);
                    userName = 'there';
                }
            }
            
            // ========== AUTHENTICATION ==========
            async function initSupabaseAuth() {
                try {
                    if (!navigator.onLine) {
                        throw new Error('offline');
                    }
                    
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) throw error;
                    
                    if (session) {
                        supabaseAccessToken = session.access_token;
                        await fetchUserProfile();
                        return true;
                    } else {
                        const { data: signInData, error: signInError } = await supabase.auth.signInAnonymously();
                        if (signInError) throw signInError;
                        supabaseAccessToken = signInData.session.access_token;
                        userName = 'there';
                        return true;
                    }
                } catch (error) {
                    console.error('Auth error:', error);
                    if (error.message === 'offline' || !navigator.onLine) {
                        await typeMessage("No internet connection. Please check your network and refresh.");
                    } else {
                        await typeMessage("Unable to authenticate. Please check your configuration and refresh the page.");
                    }
                    return false;
                }
            }
            
            // Monitor online/offline status
            window.addEventListener('online', async () => {
                isOffline = false;
                const offlineMsg = document.getElementById('offlineMsg');
                if (offlineMsg) offlineMsg.remove();
                await typeMessage("Internet connection restored. I am back.");
                await initSupabaseAuth();
                await fetchBalance();
                sendButton.disabled = false;
                micButton.disabled = false;
            });
            
            window.addEventListener('offline', () => {
                isOffline = true;
                const offlineDiv = document.createElement('div');
                offlineDiv.id = 'offlineMsg';
                offlineDiv.className = 'soft-warning';
                offlineDiv.innerHTML = 'You are offline. Please check your internet connection.';
                chatMessages.appendChild(offlineDiv);
                scrollToBottom();
                sendButton.disabled = true;
                micButton.disabled = true;
            });
            
            // ========== BALANCE FUNCTIONS ==========
            async function fetchBalance() {
                if (!supabaseAccessToken || !navigator.onLine) return;
                
                try {
                    const data = await callAPI('/coins/balance', null, 'GET');
                    if (data && data.balance !== undefined) {
                        currentBalance = data.balance;
                        balanceAmountSpan.textContent = currentBalance.toFixed(4);
                        
                        if (currentBalance <= 0) {
                            showSoftPrompt("Your coin balance is low. Tap 'add' to get more coins and continue the conversation.");
                        }
                    }
                } catch (error) {
                    console.error('Failed to fetch balance:', error);
                    balanceAmountSpan.textContent = '?';
                }
            }
            
            // ========== API FUNCTIONS ==========
            async function callAPI(endpoint, body, method = 'POST') {
                if (!supabaseAccessToken) {
                    throw new Error('Not authenticated');
                }
                
                if (!navigator.onLine) {
                    throw new Error('offline');
                }
                
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                currentAbortController = new AbortController();
                
                const options = {
                    method: method,
                    headers: {
                        'Authorization': `Bearer ${supabaseAccessToken}`,
                        'Content-Type': 'application/json'
                    },
                    signal: currentAbortController.signal
                };
                
                if (body && method === 'POST') {
                    options.body = JSON.stringify(body);
                }
                
                try {
                    const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                    
                    if (response.status === 402) {
                        throw new Error('insufficient_coins');
                    }
                    
                    if (response.status === 401) {
                        const { data: { session }, error } = await supabase.auth.refreshSession();
                        if (session && !error) {
                            supabaseAccessToken = session.access_token;
                            return callAPI(endpoint, body, method);
                        } else {
                            throw new Error('Authentication expired');
                        }
                    }
                    
                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }
                    
                    return await response.json();
                } finally {
                    currentAbortController = null;
                }
            }
            
            async function sendToLitheral(userMessage) {
                if (!navigator.onLine) {
                    throw new Error('offline');
                }
                
                // Rate limiting
                const now = Date.now();
                const timeSinceLastRequest = now - lastRequestTime;
                if (timeSinceLastRequest < 12000) {
                    const waitSeconds = Math.ceil((12000 - timeSinceLastRequest) / 1000);
                    sendButton.disabled = true;
                    micButton.disabled = true;
                    rateLimitWarning.textContent = `Please wait ${waitSeconds}s before sending another message`;
                    
                    if (rateLimitTimeout) clearTimeout(rateLimitTimeout);
                    rateLimitTimeout = setTimeout(() => {
                        sendButton.disabled = false;
                        micButton.disabled = false;
                        rateLimitWarning.textContent = '';
                    }, 12000 - timeSinceLastRequest);
                    
                    throw new Error('Rate limited');
                }
                
                lastRequestTime = now;
                
                const requestBody = {
                    message: userMessage,
                    chat_history: chatHistory
                };
                
                const data = await callAPI('/ai/chat', requestBody);
                
                if (data.balance_remaining !== undefined) {
                    currentBalance = data.balance_remaining;
                    balanceAmountSpan.textContent = currentBalance.toFixed(4);
                    
                    if (currentBalance <= 0) {
                        showSoftPrompt("Your coin balance is low. Tap 'add' to get more coins and continue the conversation.");
                    }
                }
                
                chatHistory.push(
                    { role: "user", content: userMessage },
                    { role: "model", content: data.response }
                );
                
                return data.response;
            }
            
            function showSoftPrompt(message) {
                const promptDiv = document.createElement('div');
                promptDiv.className = 'soft-warning';
                promptDiv.innerHTML = message;
                chatMessages.appendChild(promptDiv);
                scrollToBottom();
                
                setTimeout(() => {
                    if (promptDiv.parentNode) promptDiv.remove();
                }, 5000);
            }
            
            // ========== UI FUNCTIONS ==========
            let scrollRAF = null;
            function scrollToBottom() {
                if (scrollRAF) cancelAnimationFrame(scrollRAF);
                scrollRAF = requestAnimationFrame(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    scrollRAF = null;
                });
            }
            
            let scrollTimeout = null;
            function debouncedScroll() {
                if (scrollTimeout) clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(scrollToBottom, 50);
            }
            
            function typeMessage(text) {
                return new Promise((resolve) => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message Litheral';
                    
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'message-username';
                    nameDiv.textContent = 'Litheral';
                    
                    const bubbleDiv = document.createElement('div');
                    bubbleDiv.className = 'message-bubble typing-active';
                    
                    messageDiv.appendChild(nameDiv);
                    messageDiv.appendChild(bubbleDiv);
                    chatMessages.appendChild(messageDiv);
                    
                    let i = 0;
                    const typingSpeed = 25;
                    
                    function type() {
                        if (i < text.length) {
                            bubbleDiv.textContent += text[i];
                            debouncedScroll();
                            i++;
                            typingAnimationFrame = setTimeout(type, typingSpeed);
                        } else {
                            bubbleDiv.classList.remove('typing-active');
                            clearTimeout(typingAnimationFrame);
                            resolve();
                        }
                    }
                    type();
                });
            }
            
            function addUserMessage(content) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'message-username';
                nameDiv.textContent = 'You';
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                bubbleDiv.textContent = escapeHtml(content);
                
                messageDiv.appendChild(nameDiv);
                messageDiv.appendChild(bubbleDiv);
                chatMessages.appendChild(messageDiv);
                debouncedScroll();
            }
            
            // UNIQUE LITHERAL THINKING ANIMATION - Orange Pulse Ring
            function showThinkingAnimation() {
                const existing = document.getElementById('thinkingAnimation');
                if (existing) return;
                
                const thinkingDiv = document.createElement('div');
                thinkingDiv.className = 'message Litheral';
                thinkingDiv.id = 'thinkingAnimation';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'message-username';
                nameDiv.textContent = 'Litheral';
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                
                const animationContainer = document.createElement('div');
                animationContainer.className = 'litheral-thinking';
                
                // Orange pulsing ring SVG (unique to Litheral)
                animationContainer.innerHTML = `
                    <div class="thinking-ring">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="8" stroke="#FF6600" stroke-width="2" stroke-dasharray="4 4"/>
                            <circle cx="12" cy="12" r="4" fill="#FF6600" fill-opacity="0.3">
                                <animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/>
                                <animate attributeName="fill-opacity" values="0.3;0.6;0.3" dur="1.2s" repeatCount="indefinite"/>
                            </circle>
                        </svg>
                    </div>
                    <span class="thinking-text">thinking</span>
                `;
                
                bubbleDiv.appendChild(animationContainer);
                thinkingDiv.appendChild(nameDiv);
                thinkingDiv.appendChild(bubbleDiv);
                
                chatMessages.appendChild(thinkingDiv);
                scrollToBottom();
            }
            
            function hideThinkingAnimation() {
                const el = document.getElementById('thinkingAnimation');
                if (el) el.remove();
            }
            
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            // ========== MESSAGE HANDLING ==========
            async function handleSend() {
                const userMessage = chatInput.value.trim();
                if (!userMessage) return;
                
                if (!supabaseAccessToken) {
                    await typeMessage("Please wait, I am still connecting...");
                    return;
                }
                
                sendButton.disabled = true;
                micButton.disabled = true;
                
                addUserMessage(userMessage);
                showThinkingAnimation(); // New unique animation
                
                try {
                    const response = await sendToLitheral(userMessage);
                    hideThinkingAnimation();
                    await typeMessage(response);
                } catch (error) {
                    hideThinkingAnimation();
                    if (error.message === 'insufficient_coins') {
                        await typeMessage("You don't have enough coins for this message. Please tap the 'add' button in the top right to get more coins.");
                        showSoftPrompt("Need more coins? Tap 'add' to continue our conversation.");
                    } else if (error.message === 'offline' || !navigator.onLine) {
                        await typeMessage("No internet connection. Please check your network.");
                    } else if (error.message === 'Rate limited') {
                        // Already handled
                    } else if (error.message.includes('Authentication')) {
                        await typeMessage("Authentication issue. Please refresh the page.");
                    } else {
                        await typeMessage(`${error.message}`);
                    }
                    console.error('Send error:', error);
                } finally {
                    sendButton.disabled = false;
                    micButton.disabled = false;
                }
                
                chatInput.value = '';
                
                if (currentAbortController) {
                    currentAbortController.abort();
                }
            }
            
            // ========== VOICE RECOGNITION (Coming Soon) ==========
            micButton.addEventListener('click', async () => {
                const comingSoonMsg = document.createElement('div');
                comingSoonMsg.className = 'message Litheral';
                comingSoonMsg.style.opacity = '0';
                comingSoonMsg.style.transition = 'opacity 0.3s ease';
                comingSoonMsg.innerHTML = `
                    <div class="message-username">Litheral</div>
                    <div class="message-bubble">Voice input feature is coming soon. Stay tuned for updates.</div>
                `;
                chatMessages.appendChild(comingSoonMsg);
                
                setTimeout(() => { comingSoonMsg.style.opacity = '1'; }, 10);
                scrollToBottom();
                
                setTimeout(() => {
                    comingSoonMsg.style.opacity = '0';
                    setTimeout(() => {
                        if (comingSoonMsg.parentNode) comingSoonMsg.remove();
                    }, 300);
                }, 3000);
            });
            
            // ========== BUY COINS ==========
            document.getElementById('buyCoinsBtn').addEventListener('click', () => {
                window.location.href = '/Tokens';
            });
            
            // ========== EVENT LISTENERS ==========
            sendButton.addEventListener('click', handleSend);
            chatInput.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter' && !sendButton.disabled) {
                    e.preventDefault();
                    handleSend(); 
                } 
            });
            
            // ========== INITIALIZATION ==========
            async function init() {
                const authSuccess = await initSupabaseAuth();
                todaysQuote = await fetchDailyQuote();
                
                if (authSuccess && navigator.onLine) {
                    await fetchBalance();
                    const greeting = getTimeBasedGreeting();
                    // Combined greeting + quote in ONE message
                    await typeMessage(`${greeting}, ${userName}. ${todaysQuote}`);
                    
                    if (currentBalance > 0) {
                        await typeMessage(`You have ${currentBalance.toFixed(4)} coins. Each message uses a small amount.`);
                    }
                } else if (!navigator.onLine) {
                    await typeMessage("You appear to be offline. Connect to the internet to start chatting.");
                }
                
                sendButton.disabled = false;
                micButton.disabled = false;
            }
            
            init();
            
            // ========== CLEANUP ==========
            window.addEventListener('beforeunload', () => {
                if (currentAbortController) {
                    currentAbortController.abort();
                }
                if (typingAnimationFrame) clearTimeout(typingAnimationFrame);
                if (typingTimeout) clearTimeout(typingTimeout);
                if (scrollTimeout) clearTimeout(scrollTimeout);
                if (scrollRAF) cancelAnimationFrame(scrollRAF);
                if (rateLimitTimeout) clearTimeout(rateLimitTimeout);
            });
        })();
    </script>
</body>
</html>
