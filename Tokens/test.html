<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Litheral — Add Credits</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6600'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6600;
            --primary-hover: #e05a00;
            --primary-light: rgba(255, 102, 0, 0.1);
            --bg-primary: #ffffff;
            --bg-secondary: #f7f7f8;
            --bg-tertiary: #f0f0f2;
            --border-light: #e5e5e5;
            --text-primary: #1a1a1a;
            --text-secondary: #6b6b6b;
            --text-tertiary: #8e8e93;
            --sidebar-width: 280px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --success: #10b981;
            --error: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f0f13;
                --bg-secondary: #1a1a1e;
                --bg-tertiary: #252528;
                --border-light: #2c2c30;
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #6c6c70;
            }
        }

        body {
            font-family: -apple-system, 'Inter', 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 500;
            min-height: 100vh;
        }

        /* Navigation */
        .nav {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
        }

        .logo h1 {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .balance-display {
            background: var(--bg-secondary);
            padding: 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .balance-amount {
            color: var(--primary);
            font-weight: 800;
            font-size: 1.1rem;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header Section */
        .header-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-section h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .header-section p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        /* Packages Grid */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }

        .package-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-light);
            border-radius: 24px;
            padding: 28px;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .package-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .package-card.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 8px 24px rgba(255,102,0,0.15);
        }

        .package-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .package-name {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: capitalize;
            margin-bottom: 16px;
        }

        .package-coins {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .package-coins span {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .package-tokens {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .package-price {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .package-price span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Payment Actions */
        .payment-actions {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            gap: 16px;
        }

        .btn-pay {
            flex: 2;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 48px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-pay:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .btn-pay:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-cancel {
            flex: 1;
            background: transparent;
            border: 2px solid var(--border-light);
            color: var(--text-secondary);
            padding: 16px 24px;
            border-radius: 48px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
        }

        .btn-cancel:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Loading State */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Success/Error Screens */
        .result-screen {
            text-align: center;
            padding: 60px 24px;
            max-width: 500px;
            margin: 0 auto;
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 24px;
        }

        .result-icon.success { color: var(--success); }
        .result-icon.error { color: var(--error); }

        .result-screen h2 {
            font-size: 2rem;
            margin-bottom: 16px;
        }

        .result-screen p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .result-details {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin: 24px 0;
        }

        .btn-continue {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 48px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        /* Loading Screen */
        .loading-screen {
            text-align: center;
            padding: 80px 24px;
        }

        .loading-spinner-large {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 32px;
            color: var(--text-tertiary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-light);
            margin-top: 48px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }
            .header-section h1 {
                font-size: 1.75rem;
            }
            .packages-grid {
                gap: 16px;
            }
            .package-card {
                padding: 20px;
            }
            .package-coins {
                font-size: 2rem;
            }
            .payment-actions {
                flex-direction: column;
            }
            .nav-content {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="nav">
    <div class="nav-content">
        <a href="/" class="logo">
            <div class="logo-icon"></div>
            <h1>Litheral</h1>
        </a>
        <div class="balance-display">
            <span class="balance-label">available credits</span>
            <span class="balance-amount" id="balanceAmount">0.00</span>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container" id="mainContent">
    <!-- Dynamic content will be inserted here -->
</div>

<div class="footer">
    <p>Secure payments by Thesdel • Powered by Paystack</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Configuration
const SUPABASE_URL = 'https://lgfyrlfjoazedwymjpfc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnZnlybGZqb2F6ZWR3eW1qcGZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1MTc1MTksImV4cCI6MjA4MjA5MzUxOX0.g1xVMCtSkkQIu2s1pkvWwxDDvgNGbikAMkyfbZJywVw';
const API_BASE_URL = 'https://sdel.onrender.com';

// Global state
let supabaseAccessToken = null;
let currentUserId = null;
let packages = null;
let selectedPackage = null;
let currentBalance = 0;

// DOM Elements
const mainContent = document.getElementById('mainContent');
const balanceAmountSpan = document.getElementById('balanceAmount');

// Helper Functions
function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function formatNumber(num) {
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

async function callAPI(endpoint, options = {}) {
    if (!supabaseAccessToken) throw new Error('Not authenticated');
    
    const defaultOptions = {
        headers: {
            'Authorization': `Bearer ${supabaseAccessToken}`,
            'Content-Type': 'application/json'
        }
    };
    
    const mergedOptions = { ...defaultOptions, ...options };
    
    const response = await fetch(`${API_BASE_URL}${endpoint}`, mergedOptions);
    
    if (response.status === 401) {
        const { data: { session } } = await supabase.auth.refreshSession();
        if (session) {
            supabaseAccessToken = session.access_token;
            return callAPI(endpoint, options);
        }
    }
    
    if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        const err = new Error(error.detail || `API error: ${response.status}`);
        err.status = response.status;
        throw err;
    }
    
    return await response.json();
}

async function fetchBalance() {
    try {
        const data = await callAPI('/coins/balance', { method: 'GET' });
        currentBalance = data.balance;
        balanceAmountSpan.textContent = currentBalance.toFixed(4);
        return currentBalance;
    } catch (error) {
        console.error('Error fetching balance:', error);
        return null;
    }
}

async function fetchPackages() {
    try {
        const data = await callAPI('/coins/packages', { method: 'GET' });
        packages = data.packages;
        return packages;
    } catch (error) {
        console.error('Error fetching packages:', error);
        throw error;
    }
}

async function initializePayment(packageKey) {
    try {
        const data = await callAPI('/coins/initialise', {
            method: 'POST',
            body: JSON.stringify({ package: packageKey })
        });
        return data;
    } catch (error) {
        if (error.status === 429) {
            throw new Error('Too many requests. Please wait a moment before trying again.');
        }
        throw error;
    }
}

async function verifyPayment(reference) {
    try {
        const data = await callAPI(`/coins/verify/${reference}`, { method: 'GET' });
        return data;
    } catch (error) {
        if (error.status === 400) {
            throw new Error('This payment has already been processed.');
        }
        if (error.status === 402) {
            throw new Error('Payment was not successful. Please try again.');
        }
        throw error;
    }
}

// UI Rendering Functions
function showLoading() {
    mainContent.innerHTML = `
        <div class="loading-screen">
            <div class="loading-spinner-large"></div>
            <p>Loading packages...</p>
        </div>
    `;
}

function showPackagesView() {
    if (!packages) return;
    
    const packagesArray = Object.entries(packages);
    
    mainContent.innerHTML = `
        <div class="header-section">
            <h1>Add Credits</h1>
            <p>Choose a package that fits your needs. Credits never expire.</p>
        </div>
        
        <div class="packages-grid">
            ${packagesArray.map(([key, pkg]) => {
                return `
                    <div class="package-card ${selectedPackage === key ? 'selected' : ''}" 
                         onclick="selectPackage('${key}')">
                        ${key === 'popular' ? '<div class="package-badge">🔥 MOST POPULAR</div>' : ''}
                        ${key === 'best_value' ? '<div class="package-badge">⭐ BEST VALUE</div>' : ''}
                        <div class="package-name">${key.replace('_', ' ').toUpperCase()}</div>
                        <div class="package-coins">
                            ${formatNumber(pkg.coins)} <span>credits</span>
                        </div>
                        <div class="package-tokens">
                            ≈ ${formatNumber(Math.floor(pkg.tokens / 1000))}K tokens
                        </div>
                        <div class="package-price">
                            ₦${pkg.amount_naira.toLocaleString()} <span>NGN</span>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
        
        <div class="payment-actions">
            <a href="/" class="btn-cancel">Cancel</a>
            <button class="btn-pay" id="payButton" ${!selectedPackage ? 'disabled' : ''}>
                Continue to Paystack
            </button>
        </div>
    `;
    
    // Add event listener to pay button
    const payButton = document.getElementById('payButton');
    if (payButton) {
        payButton.addEventListener('click', processPayment);
    }
}

function showProcessingView() {
    mainContent.innerHTML = `
        <div class="loading-screen">
            <div class="loading-spinner-large"></div>
            <h3>Initializing payment...</h3>
            <p style="margin-top: 12px; color: var(--text-secondary);">Please don't close this window</p>
        </div>
    `;
}

function showSuccessView(data) {
    mainContent.innerHTML = `
        <div class="result-screen">
            <div class="result-icon success">✓</div>
            <h2>Payment Successful!</h2>
            <p>Your credits have been added to your account.</p>
            <div class="result-details">
                <div style="margin-bottom: 12px;">
                    <strong>+${data.coins_added} credits added</strong>
                </div>
                <div style="font-size: 1.25rem; color: var(--primary);">
                    New balance: ${data.new_balance.toFixed(4)} credits
                </div>
            </div>
            <a href="/" class="btn-continue">Continue to Dashboard</a>
        </div>
    `;
    
    // Refresh balance display
    fetchBalance();
}

function showErrorView(message) {
    mainContent.innerHTML = `
        <div class="result-screen">
            <div class="result-icon error">⚠️</div>
            <h2>Payment Failed</h2>
            <p>${escapeHtml(message)}</p>
            <div class="result-details">
                <p style="color: var(--text-secondary);">Need help? Contact support.</p>
            </div>
            <div style="display: flex; gap: 16px; justify-content: center; margin-top: 16px;">
                <button onclick="location.reload()" class="btn-cancel" style="padding: 12px 24px;">Try Again</button>
                <a href="/" class="btn-continue">Back to Dashboard</a>
            </div>
        </div>
    `;
}

// Package Selection
window.selectPackage = function(packageKey) {
    selectedPackage = packageKey;
    showPackagesView();
};

// Process Payment
async function processPayment() {
    if (!selectedPackage) return;
    
    showProcessingView();
    
    try {
        const paymentData = await initializePayment(selectedPackage);
        
        // Store payment info before redirect
        sessionStorage.setItem('pendingPayment', JSON.stringify({
            reference: paymentData.reference,
            package: paymentData.package,
            coins: paymentData.coins,
            amount: paymentData.amount_naira
        }));
        
        // Redirect to Paystack
        window.location.href = paymentData.authorization_url;
    } catch (error) {
        showErrorView(error.message);
    }
}

// Handle Payment Redirect
async function handlePaymentRedirect() {
    const urlParams = new URLSearchParams(window.location.search);
    const reference = urlParams.get('reference');
    
    if (reference) {
        showLoading();
        
        try {
            const verifyData = await verifyPayment(reference);
            showSuccessView(verifyData);
            
            // Clear URL parameters without reload
            window.history.replaceState({}, document.title, window.location.pathname);
            sessionStorage.removeItem('pendingPayment');
        } catch (error) {
            showErrorView(error.message);
        }
    } else {
        // Check for pending payment (user returned without reference)
        const pending = sessionStorage.getItem('pendingPayment');
        if (pending) {
            // User might have closed Paystack without completing
            sessionStorage.removeItem('pendingPayment');
            showPackagesView();
        }
    }
}

// Authentication
async function initAuth() {
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await supabase.auth.getSession();
    
    if (session) {
        supabaseAccessToken = session.access_token;
        currentUserId = session.user.id;
    } else {
        const { data } = await supabase.auth.signInAnonymously();
        supabaseAccessToken = data.session.access_token;
        currentUserId = data.session.user.id;
    }
    
    return supabaseAccessToken;
}

// Initialize Page
async function init() {
    showLoading();
    
    try {
        await initAuth();
        await fetchBalance();
        await fetchPackages();
        await handlePaymentRedirect();
        
        // If no redirect was handled, show packages view
        if (!window.location.search.includes('reference')) {
            showPackagesView();
        }
    } catch (error) {
        console.error('Init error:', error);
        showErrorView('Failed to load payment options. Please refresh the page.');
    }
}

// Start the app
init();
</script>
</body>
</html>
