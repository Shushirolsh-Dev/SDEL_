    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-orange: #FF6600;
            --bg-dark: #000000;
            --card-bg: #000000;
            --border-color: #222;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --soft-warning: rgba(255, 102, 0, 0.15);
            --error-red: rgba(255, 70, 70, 0.2);
            --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            width: 100%;
            background: var(--bg-dark);
            position: fixed;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'Inter', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 100%;
            height: 100%;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--bg-dark);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 24px;
            height: 24px;
            background: var(--primary-orange);
            border-radius: 4px;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-orange);
            letter-spacing: 0.5px;
        }

        .balance-container {
            background: rgba(255, 102, 0, 0.12);
            padding: 6px 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 102, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 500;
        }

        .balance-amount {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .buy-coins-btn {
            background: var(--primary-orange);
            border: none;
            color: black;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .buy-coins-btn:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .chat-messages::-webkit-scrollbar {
            display: none;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-username {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .message.Litheral .message-username {
            color: var(--primary-orange);
        }

        .message.user .message-username {
            color: var(--text-main);
            text-align: right;
        }

        .message-bubble {
            line-height: 1.5;
            font-size: 0.95rem;
            max-width: 100%;
            word-wrap: break-word;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        .message.user .message-bubble {
            text-align: right;
            color: #cccccc;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-start;
        }
        .message.user .message-actions {
            justify-content: flex-end;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            backdrop-filter: blur(4px);
        }
        .action-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--text-secondary);
            stroke-width: 1.8;
            fill: none;
            transition: stroke 0.2s, transform 0.1s;
        }
        .action-btn:hover {
            background: rgba(255, 102, 0, 0.2);
            border-radius: 10px;
        }
        .action-btn:hover svg {
            stroke: var(--primary-orange);
        }
        .action-btn:active {
            transform: scale(0.94);
        }
        
        .static-retry svg {
            animation: none !important;
        }
        
        .copy-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-orange);
            color: black;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .litheral-thinking {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .thinking-ring {
            position: relative;
            width: 24px;
            height: 24px;
        }

        .thinking-ring svg {
            width: 100%;
            height: 100%;
            animation: litheralPulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes litheralPulse {
            0% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.3; }
        }

        .thinking-text {
            color: var(--primary-orange);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            animation: textFade 1.2s ease-in-out infinite;
        }

        @keyframes textFade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .typing-active::after {
            content: "▊";
            display: inline-block;
            color: var(--primary-orange);
            margin-left: 2px;
            animation: blink-cursor 0.8s step-start infinite;
        }

        @keyframes blink-cursor {
            50% { opacity: 0; }
        }

        .chat-input-area {
            padding: 16px 16px calc(16px + var(--safe-area-inset-bottom));
            background: var(--bg-dark);
            flex-shrink: 0;
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 10px;
            background: #0a0a0a;
            border: 1.5px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 30px;
            align-items: center;
            transition: all 0.2s ease;
        }

        .input-container:focus-within {
            border-color: var(--primary-orange);
            transform: scale(1.01);
        }

        .chat-input {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            min-width: 0;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
        }

        .chat-input::placeholder {
            color: #444;
            font-size: 0.9rem;
        }

        .send-button, .mic-button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .send-button:active, .mic-button:active {
            transform: scale(0.92);
        }

        .send-button {
            color: var(--primary-orange);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 6px 12px;
        }

        .send-button:disabled, .mic-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .soft-warning {
            color: var(--primary-orange);
            font-size: 0.85rem;
            padding: 12px;
            background: var(--soft-warning);
            border-radius: 12px;
            margin: 8px 0;
            text-align: center;
            border: 1px solid rgba(255, 102, 0, 0.3);
        }

        .error-message {
            background: rgba(255, 70, 70, 0.15);
            border-left: 3px solid #ff4444;
            padding: 12px;
            border-radius: 12px;
            margin: 8px 0;
            font-size: 0.85rem;
            color: #ffaaaa;
        }

        .rate-limit-warning {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }

        .retry-spinning svg {
            animation: spin 0.7s linear infinite !important;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .chat-header { padding: 12px 16px; }
            .chat-messages { padding: 16px 12px; gap: 20px; }
            .message-bubble { font-size: 0.9rem; }
            .balance-label { display: none; }
            .action-btn { width: 38px; height: 38px; }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    (function() {
        const SUPABASE_URL = 'https://lgfyrlfjoazedwymjpfc.supabase.co';

        // Human-readable error explanation for file/API errors (no raw codes)
        function getHumanReadableErrorMessage(errorObj) {
            const message = errorObj?.message || errorObj?.toString() || '';
            const status = errorObj?.status || errorObj?.statusCode;
            
            // Common API error scenarios explained in English
            if (message.includes('insufficient_coins')) {
                return "You don't have enough coins to send this message. Tap the 'add' button to get more coins and continue the conversation.";
            }
            if (message.includes('offline') || !navigator.onLine) {
                return "You're currently offline. Please check your internet connection and try again once you're back online.";
            }
            if (message.includes('Rate limited') || message.includes('rate limit') || message.includes('too many requests')) {
                return "You're sending messages too quickly. Please wait a moment before your next message. The system will automatically retry when ready.";
            }
            if (message.includes('NetworkError') || message.includes('fetch') || message.includes('Failed to fetch')) {
                return "Network connection issue. The server might be unreachable — check your internet or try again in a few seconds.";
            }
            if (status === 401 || message.includes('unauthorized') || message.includes('token')) {
                return "Session expired. Refreshing your login — this should only take a moment.";
            }
            if (status === 402) {
                return "Coin balance too low. Add more coins using the 'add' button to continue.";
            }
            if (status === 403) {
                return "Access denied. Please refresh the page and try again.";
            }
            if (status === 404) {
                return "Service temporarily unavailable. The AI endpoint could not be reached. Please try again in a minute.";
            }
            if (status === 500 || status === 502 || status === 503 || status === 504) {
                return "Our server is under heavy load or experiencing issues. Please wait a few seconds and try again. Your message hasn't been lost.";
            }
            if (message.includes('timeout') || message.includes('Timed out')) {
                return "The request took too long. The AI is thinking deeply — please retry in a moment.";
            }
            if (message.includes('aborted')) {
                return "Previous request was cancelled. Feel free to send a new message.";
            }
            if (message.includes('JSON') || message.includes('parse')) {
                return "Received an unexpected response from the server. Please try again.";
            }
            
            // Fallback for any raw API code appearance (ensures we never show "API ###")
            const rawCodeMatch = message.match(/API[:\s]*(\d{3})/i) || message.match(/error[:\s]*(\d{3})/i);
            if (rawCodeMatch) {
                const code = rawCodeMatch[1];
                const codeExplanations = {
                    '400': "The request was invalid. Please rephrase your message and try again.",
                    '401': "Authentication issue. Refreshing your session...",
                    '403': "You don't have permission for this action. Try reloading.",
                    '404': "The AI service endpoint is temporarily offline.",
                    '429': "Too many requests. Please wait a moment before sending another message.",
                    '500': "Internal server error. Our team has been notified — please retry.",
                    '502': "Bad gateway. The AI service is restarting, wait a few seconds.",
                    '503': "Service is temporarily overloaded. Please wait and retry.",
                    '504': "Gateway timeout. The AI is taking longer than expected."
                };
                return codeExplanations[code] || `Something went wrong (server responded with error ${code}). Please refresh the page or try again later.`;
            }
            
            // Default clean message
            if (message && !message.includes('API')) return message;
            return "Unable to process your request. Please try again in a moment.";
        }
        
        async function fetchRandomQuote() {
            try {
                const { data, error } = await supabase.from('quotes').select('quote_text');
                if (error) throw error;
                if (data && data.length > 0) {
                    const randomIndex = Math.floor(Math.random() * data.length);
                    return data[randomIndex].quote_text;
                }
                return "Clarity is power. Truth over comfort.";
            } catch(e) {
                return "Clarity over comfort. Truth over convenience.";
            }
        }
        
        function getTimeBasedGreeting() {
            const hour = new Date().getHours();
            if (hour < 12) return "Good morning";
            if (hour < 17) return "Good afternoon";
            return "Good evening";
        }
        
        const placeholders = ["Think Clearly", "Clarity over noise", "Speak freely", "Ask anything"];
        let phIndex = 0;
        setInterval(() => {
            phIndex = (phIndex + 1) % placeholders.length;
            if (!chatInput.value) chatInput.placeholder = placeholders[phIndex];
        }, 3000);
        chatInput.placeholder = placeholders[0];
        
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(120, this.scrollHeight) + 'px';
        });
        
        async function fetchUserProfile() {
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (user) {
                    const { data: profile } = await supabase.from('profile').select('first_name').eq('id', user.id).single();
                    if (profile?.first_name) userName = profile.first_name;
                    else userName = user.email ? user.email.split('@')[0] : 'there';
                } else userName = 'there';
            } catch(e) { userName = 'there'; }
        }
        
        async function initSupabaseAuth() {
            try {
                if (!navigator.onLine) throw new Error('offline');
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    supabaseAccessToken = session.access_token;
                    await fetchUserProfile();
                    return true;
                } else {
                    const { data: signInData } = await supabase.auth.signInAnonymously();
                    supabaseAccessToken = signInData.session.access_token;
                    userName = 'there';
                    return true;
                }
            } catch (error) {
                await typeMessage("Connection issue. Please refresh and ensure you're online.");
                return false;
            }
        }
        
        async function callAPI(endpoint, body, method = 'POST') {
            if (!supabaseAccessToken) throw new Error('Not authenticated');
            if (!navigator.onLine) throw new Error('offline');
            if (currentAbortController) currentAbortController.abort();
            currentAbortController = new AbortController();
            const options = { method, headers: { 'Authorization': `Bearer ${supabaseAccessToken}`, 'Content-Type': 'application/json' }, signal: currentAbortController.signal };
            if (body && method === 'POST') options.body = JSON.stringify(body);
            const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
            if (response.status === 402) throw new Error('insufficient_coins');
            if (response.status === 401) {
                const { data: { session } } = await supabase.auth.refreshSession();
                if (session) supabaseAccessToken = session.access_token;
                return callAPI(endpoint, body, method);
            }
            if (!response.ok) {
                let errorDetail = `Request failed with status ${response.status}`;
                try {
                    const errorJson = await response.json();
                    if (errorJson.message) errorDetail = errorJson.message;
                } catch(e) {}
                throw new Error(errorDetail);
            }
            return await response.json();
        }
        
        async function fetchBalance() {
            if (!supabaseAccessToken || !navigator.onLine) return;
            try {
                const data = await callAPI('/coins/balance', null, 'GET');
                if (data && data.balance !== undefined) {
                    currentBalance = data.balance;
                    balanceAmountSpan.textContent = currentBalance.toFixed(4);
                }
            } catch(e) { balanceAmountSpan.textContent = '?'; }
        }
        
        async function sendToLitheral(userMessage, isRetry = false) {
            if (!navigator.onLine) throw new Error('offline');
            const now = Date.now();
            const timeSinceLastRequest = now - lastRequestTime;
            if (timeSinceLastRequest < 12000) {
                const waitSeconds = Math.ceil((12000 - timeSinceLastRequest) / 1000);
                sendButton.disabled = true; micButton.disabled = true;
                rateLimitWarning.textContent = `Slow down — please wait ${waitSeconds}s before sending another message.`;
                if (rateLimitTimeout) clearTimeout(rateLimitTimeout);
                rateLimitTimeout = setTimeout(() => {
                    sendButton.disabled = false; micButton.disabled = false;
                    rateLimitWarning.textContent = '';
                    if (pendingRetryMessage) {
                        const msg = pendingRetryMessage;
                        pendingRetryMessage = null;
                        handleSendWithText(msg);
                    }
                }, 12000 - timeSinceLastRequest);
                throw new Error('Rate limited');
            }
            lastRequestTime = now;
            const requestBody = { message: userMessage, chat_history: chatHistory };
            const data = await callAPI('/ai/chat', requestBody);
            if (data.balance_remaining !== undefined) {
                currentBalance = data.balance_remaining;
                balanceAmountSpan.textContent = currentBalance.toFixed(4);
            }
            if (!isRetry) {
                chatHistory.push({ role: "user", content: userMessage }, { role: "model", content: data.response });
            } else {
                if (chatHistory.length && chatHistory[chatHistory.length-1].role === 'model') chatHistory.pop();
                chatHistory.push({ role: "model", content: data.response });
            }
            return data.response;
        }

        function addUserMessage(content) {
            const msgDiv = document.createElement('div'); msgDiv.className = 'message user';
            const nameDiv = document.createElement('div'); nameDiv.className = 'message-username'; nameDiv.textContent = 'You';
            const bubbleDiv = document.createElement('div'); bubbleDiv.className = 'message-bubble'; bubbleDiv.textContent = content;
            msgDiv.appendChild(nameDiv); msgDiv.appendChild(bubbleDiv);
            const actions = document.createElement('div'); actions.className = 'message-actions';
            
            const editBtn = document.createElement('button'); editBtn.className = 'action-btn'; editBtn.innerHTML = editIcon;
            editBtn.onclick = () => { chatInput.value = content; chatInput.focus(); chatInput.dispatchEvent(new Event('input')); };
            const copyBtn = document.createElement('button'); copyBtn.className = 'action-btn'; copyBtn.innerHTML = copyIcon;
            copyBtn.onclick = () => { navigator.clipboard.writeText(content); showCopyToast(); };
            const shareBtn = document.createElement('button'); shareBtn.className = 'action-btn'; shareBtn.innerHTML = shareIcon;
            shareBtn.onclick = () => { if(navigator.share) navigator.share({text: content}); else copyBtn.click(); };
            
            actions.appendChild(editBtn); actions.appendChild(copyBtn); actions.appendChild(shareBtn);
            msgDiv.appendChild(actions);
            chatMessages.appendChild(msgDiv);
            debouncedScroll();
        }
        
        async function typeMessage(text, isError = false) {
            return new Promise((resolve) => {
                const messageDiv = document.createElement('div'); messageDiv.className = 'message Litheral';
                const nameDiv = document.createElement('div'); nameDiv.className = 'message-username'; nameDiv.textContent = 'Litheral';
                const bubbleDiv = document.createElement('div'); bubbleDiv.className = 'message-bubble typing-active';
                if (isError) bubbleDiv.style.color = '#ffaaaa';
                messageDiv.appendChild(nameDiv); messageDiv.appendChild(bubbleDiv);
                chatMessages.appendChild(messageDiv);
                let i = 0;
                function typeChar() {
                    if (i < text.length) {
                        bubbleDiv.textContent += text[i];
                        debouncedScroll();
                        i++;
                        typingAnimationFrame = setTimeout(typeChar, 22);
                    } else {
                        bubbleDiv.classList.remove('typing-active');
                        clearTimeout(typingAnimationFrame);
                        const actionsDiv = document.createElement('div'); actionsDiv.className = 'message-actions';
                        const retryBtn = document.createElement('button'); 
                        retryBtn.className = 'action-btn static-retry';
                        retryBtn.innerHTML = staticRetryIcon;
                        const copyBtn = document.createElement('button'); copyBtn.className = 'action-btn'; copyBtn.innerHTML = copyIcon;
                        const shareBtn = document.createElement('button'); shareBtn.className = 'action-btn'; shareBtn.innerHTML = shareIcon;
                        
                        copyBtn.onclick = () => { navigator.clipboard.writeText(text); showCopyToast(); };
                        shareBtn.onclick = () => { if(navigator.share) navigator.share({text}); else copyBtn.click(); };
                        
                        if (!isError) {
                            retryBtn.onclick = async (e) => {
                                const lastUserMsgElem = [...chatMessages.querySelectorAll('.message.user')].pop();
                                if (lastUserMsgElem) {
                                    const originalMessage = lastUserMsgElem.querySelector('.message-bubble')?.textContent;
                                    if (originalMessage) {
                                        if (chatHistory.length && chatHistory[chatHistory.length-1].role === 'model') chatHistory.pop();
                                        messageDiv.remove();
                                        showThinkingAnimation();
                                        retryBtn.classList.add('retry-spinning');
                                        try {
                                            const newResponse = await sendToLitheral(originalMessage, true);
                                            hideThinkingAnimation();
                                            await typeMessage(newResponse);
                                        } catch(err) { 
                                            hideThinkingAnimation(); 
                                            await typeMessage(getHumanReadableErrorMessage(err), true);
                                        } finally {
                                            retryBtn.classList.remove('retry-spinning');
                                            retryBtn.innerHTML = staticRetryIcon;
                                        }
                                    }
                                }
                            };
                            actionsDiv.appendChild(retryBtn);
                        }
                        actionsDiv.appendChild(copyBtn); actionsDiv.appendChild(shareBtn);
                        messageDiv.appendChild(actionsDiv);
                        resolve();
                    }
                }
                typeChar();
            });
        }
        
        function showThinkingAnimation() {
            if(document.getElementById('thinkingAnimation')) return;
            const thinkingDiv = document.createElement('div'); thinkingDiv.className = 'message Litheral'; thinkingDiv.id = 'thinkingAnimation';
            const nameDiv = document.createElement('div'); nameDiv.className = 'message-username'; nameDiv.textContent = 'Litheral';
            const bubbleDiv = document.createElement('div'); bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = `<div class="litheral-thinking"><div class="thinking-ring"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#FF6600" stroke-width="2" stroke-dasharray="4 4"/><circle cx="12" cy="12" r="4" fill="#FF6600" fill-opacity="0.3"><animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0.3;0.6;0.3" dur="1.2s" repeatCount="indefinite"/></circle></svg></div><span class="thinking-text">thinking</span></div>`;
            thinkingDiv.appendChild(nameDiv); thinkingDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(thinkingDiv);
            scrollToBottom();
        }
        function hideThinkingAnimation() { document.getElementById('thinkingAnimation')?.remove(); }
        
        async function handleSendWithText(userMessage) {
            if (!userMessage.trim()) return;
            if (!supabaseAccessToken) { await typeMessage("Connecting to secure session..."); return; }
            sendButton.disabled = true; micButton.disabled = true;
            addUserMessage(userMessage);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            showThinkingAnimation();
            try {
                const response = await sendToLitheral(userMessage, false);
                hideThinkingAnimation();
                await typeMessage(response);
                pendingRetryMessage = null;
            } catch (error) {
                hideThinkingAnimation();
                const friendlyMsg = getHumanReadableErrorMessage(error);
                await typeMessage(friendlyMsg, true);
                if (error.message === 'Rate limited') {
                    pendingRetryMessage = userMessage;
                }
            } finally {
                sendButton.disabled = false; micButton.disabled = false;
                if (currentAbortController) currentAbortController.abort();
            }
        }
        
        async function handleSend() { 
            const messageText = chatInput.value.trim();
            if (messageText) await handleSendWithText(messageText);
        }
        
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        
        sendButton.addEventListener('click', handleSend);
        micButton.addEventListener('click', () => {
            typeMessage("Voice input is under development. Stay tuned for voice clarity.", false);
        });
        document.getElementById('buyCoinsBtn').addEventListener('click', () => window.location.href = '/Tokens');
        
        window.addEventListener('online', async () => {
            document.getElementById('offlineMsg')?.remove();
            await typeMessage("Connection restored. You can continue chatting.");
            await initSupabaseAuth(); await fetchBalance();
            sendButton.disabled = false; micButton.disabled = false;
        });
        window.addEventListener('offline', () => {
            const offlineDiv = document.createElement('div'); offlineDiv.id = 'offlineMsg'; offlineDiv.className = 'soft-warning';
            offlineDiv.innerHTML = '📡 You are offline. Reconnect to continue.';
            chatMessages.appendChild(offlineDiv); scrollToBottom();
            sendButton.disabled = true; micButton.disabled = true;
        });
        
        async function init() {
            const ok = await initSupabaseAuth();
            if (ok && navigator.onLine) {
                await fetchBalance();
                const greeting = getTimeBasedGreeting();
                const quote = await fetchRandomQuote();
                await typeMessage(`${greeting}, ${userName}. ${quote}`);
                if (currentBalance > 0) await typeMessage(`You have ${currentBalance.toFixed(4)} coins. Each message uses a small amount.`);
            } else if (!navigator.onLine) { await typeMessage("Offline mode — connect to the internet to talk with Litheral."); }
            sendButton.disabled = false; micButton.disabled = false;
        }
        init();
        
        window.addEventListener('beforeunload', () => {
            if(currentAbortController) currentAbortController.abort();
            if(typingAnimationFrame) clearTimeout(typingAnimationFrame);
            if(rateLimitTimeout) clearTimeout(rateLimitTimeout);
        });
    })();
</script>
</body>
</html>
